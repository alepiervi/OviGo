<!DOCTYPE html>
<html lang="it">
<head>
<meta name="description" content="OVIGO: viaggi di gruppo organizzati da agenzie verificate. Pullman, voli, crociere, cammini e tour per tutte le età.">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f4c5c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OVIGO">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>OVIGO · Viaggi di gruppo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16302f; --ink2:#4a5e5c; --muted:#7d8c8a; --line:#e4e0d6; --bg:#fbf8f2; --card:#ffffff;
  --teal:#0f4c5c; --teal2:#1a6b7c; --tealsoft:#e3eff0; --coral:#e2622b; --coralsoft:#fbe9df;
  --green:#2f7d4f; --greensoft:#e3f2e7; --amber:#b7791f; --ambersoft:#fbf0d9; --red:#b83a3a; --redsoft:#f9e3e3;
  --r:14px; --sh:0 1px 2px rgba(22,48,47,.06),0 6px 20px rgba(22,48,47,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0 0 .4em}
h1{font-size:2.4rem;line-height:1.1} h2{font-size:1.6rem} h3{font-size:1.15rem}
a{color:var(--teal2)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.75rem}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.g2,.g3,.g4{grid-template-columns:1fr} h1{font-size:1.8rem}}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:.9rem;transition:.15s}
.btn:hover{border-color:var(--teal2)}
.btn.pri{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.pri:hover{background:#cc5420}
.btn.dark{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:5px 11px;font-size:.8rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:700;letter-spacing:.02em;background:var(--tealsoft);color:var(--teal)}
.badge.coral{background:var(--coralsoft);color:#a8441a}
.badge.green{background:var(--greensoft);color:var(--green)}
.badge.amber{background:var(--ambersoft);color:var(--amber)}
.badge.red{background:var(--redsoft);color:var(--red)}
.badge.gray{background:#efede8;color:var(--ink2)}
label{display:block;font-size:.8rem;font-weight:600;color:var(--ink2);margin-bottom:4px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--tealsoft);border-color:var(--teal2)}
.field{margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* demo bar */
#demobar{background:var(--ink);color:#e9efee;font-size:.82rem}
#demobar .wrap{display:flex;gap:14px;align-items:center;padding-top:7px;padding-bottom:7px;flex-wrap:wrap}
#demobar select{width:auto;padding:3px 8px;border-radius:8px;background:#22403f;color:#fff;border-color:#335553;font-size:.82rem}
#demobar a{color:#ffd2b8;text-decoration:none;font-weight:600}
#demobar .dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#888}
#demobar .dot.on{background:#5fd18a}

/* header */
header.site{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.site .wrap{display:flex;align-items:center;gap:18px;height:64px}
.logo{font-family:'Fraunces',serif;font-weight:700;font-size:1.55rem;color:var(--teal);text-decoration:none;letter-spacing:-.02em}
.logo span{color:var(--coral)}
nav.main{display:flex;gap:2px;flex:1;align-items:center}
nav.main a{text-decoration:none;color:var(--ink2);font-weight:600;font-size:.86rem;padding:8px 9px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav.main a:hover,nav.main a.on{background:var(--tealsoft);color:var(--teal)}
@media(max-width:1460px){nav.main a.opt{display:none}}nav.main{min-width:0;overflow:hidden}@media(max-width:640px){header.site .wrap{gap:6px}header.site .lang{display:none}header.site .row{gap:4px}header.site .row .btn{padding:6px 9px;font-size:.78rem}header.site .logo{font-size:1.3rem}}
header.site .row{flex-wrap:nowrap}
.btn{white-space:nowrap}@media(max-width:800px){nav.main{display:none}}
.bell{position:relative}
.bell .n{position:absolute;top:-4px;right:-4px;background:var(--coral);color:#fff;border-radius:999px;font-size:.65rem;padding:1px 5px;font-weight:700}

/* hero */
.hero{background:linear-gradient(120deg,#0f4c5c 0%,#1a6b7c 55%,#2b8a8a 100%);color:#fff;padding:52px 0 70px;position:relative;overflow:hidden}
.hero h1{color:#fff;max-width:640px}
.hero p{max-width:560px;opacity:.9;font-size:1.05rem}
.searchbox{background:#fff;color:var(--ink);border-radius:18px;padding:16px;margin-top:22px;box-shadow:0 10px 40px rgba(0,0,0,.18);display:grid;grid-template-columns:1.1fr 1.2fr 1fr 1.4fr auto;gap:10px;align-items:end}
@media(max-width:900px){.searchbox{grid-template-columns:1fr 1fr}}
.smart{margin-top:12px;display:flex;gap:8px;background:rgba(255,255,255,.14);border-radius:999px;padding:6px 6px 6px 16px;align-items:center;max-width:720px}
.smart input{background:transparent;border:none;color:#fff;padding:6px 0}
.smart input::placeholder{color:#d6ecee}
.smart input:focus{outline:none}

section.block{padding:38px 0 8px}
.sechead{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px;gap:10px}
.sechead p{margin:0}

/* tour card */
.tcard{overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:.15s}
.tcard:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(22,48,47,.12)}
.tcard .img{height:150px;position:relative}
.tcard .img svg{width:100%;height:100%;display:block}
.tcard .img .tags{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap}
.tcard .heart{position:absolute;right:10px;top:10px;background:rgba(255,255,255,.92);border:none;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center}
.tcard .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.tcard .title{font-family:'Fraunces',serif;font-weight:600;font-size:1.08rem;line-height:1.25}
.tcard .price{font-weight:700;font-size:1.15rem;color:var(--teal)}
.tcard .price small{font-weight:500;font-size:.75rem;color:var(--muted)}
.fill{height:7px;background:#ece8df;border-radius:999px;overflow:hidden;position:relative}
.fill i{display:block;height:100%;background:var(--teal2);border-radius:999px}
.fill .min{position:absolute;top:-3px;width:2px;height:13px;background:var(--coral)}
.fill.ok i{background:var(--green)}

/* theme boxes */
.tbox{border-radius:var(--r);overflow:hidden;position:relative;height:150px;cursor:pointer;color:#fff}
.tbox svg{position:absolute;inset:0;width:100%;height:100%}
.tbox .lbl{position:absolute;left:14px;bottom:12px;right:14px;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.tbox .lbl b{font-family:'Fraunces',serif;font-size:1.15rem;display:block;line-height:1.15}
.tbox .lbl span{font-size:.8rem;opacity:.95}
.tbox:hover{filter:brightness(1.06)}

/* detail */
.detailhero{height:280px;border-radius:var(--r);overflow:hidden;position:relative}
.detailhero svg{width:100%;height:100%}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 14px;overflow-x:auto}
.tabs a{padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;text-decoration:none}
.tabs a.on{color:var(--teal);border-color:var(--coral)}
.dlayout{display:grid;grid-template-columns:1fr 340px;gap:26px;margin-top:20px}
@media(max-width:900px){.dlayout{grid-template-columns:1fr}}
.side{position:sticky;top:80px;align-self:start}
.dlayout>div{min-width:0}
.day{display:grid;grid-template-columns:62px 1fr;gap:14px;padding:12px 0;border-bottom:1px dashed var(--line)}
.day .d{background:var(--tealsoft);color:var(--teal);border-radius:12px;text-align:center;padding:8px 0;font-weight:700;line-height:1.1;height:max-content}
.day .d small{display:block;font-weight:500;font-size:.7rem}
.hotel{background:#faf8f3;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:.88rem}

/* seat map */
.bus{background:#f3f1ec;border:2px solid #d8d3c7;border-radius:28px 28px 14px 14px;padding:16px 14px;display:inline-block}
.bus .front{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);margin-bottom:8px}
.seatrow{display:grid;grid-template-columns:repeat(2,30px) 18px repeat(2,30px);gap:6px;margin-bottom:6px}
.seatrow.last{grid-template-columns:repeat(5,30px)}
.seat{width:30px;height:30px;border-radius:7px 7px 4px 4px;border:none;font-size:.68rem;font-weight:700;cursor:pointer;background:#cfe7d6;color:#1f5133}
.seat.occ{background:#c9c5bc;color:#87837a;cursor:not-allowed}
.seat.blk{background:#f3dfb4;color:#8a6417;cursor:not-allowed}
.seat.sel{background:var(--coral);color:#fff}
.seat.mine{background:var(--teal);color:#fff}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--ink2);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}

/* app shell for CRMs */
.app{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 100px)}
@media(max-width:800px){.app{grid-template-columns:1fr}}
.sidebar{background:#fff;border-right:1px solid var(--line);padding:18px 12px}
.sidebar .who{padding:6px 10px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.sidebar a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:9px;color:var(--ink2);text-decoration:none;font-weight:600;font-size:.88rem;cursor:pointer}
.sidebar a:hover{background:#f4f2ec}
.sidebar a.on{background:var(--tealsoft);color:var(--teal)}
.sidebar .grp{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 10px 4px;font-weight:700}
.main{padding:24px 28px 60px}
@media(max-width:600px){.main{padding:18px 14px 50px}}
.kpi{padding:16px}
.kpi .v{font-size:1.6rem;font-weight:700;font-family:'Fraunces',serif;color:var(--teal)}
.kpi .l{font-size:.78rem;color:var(--muted);font-weight:600}
.cnt{background:var(--coral);color:#fff;border-radius:999px;font-size:.7rem;padding:1px 7px}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);background:#fff}
.list .item{padding:14px 16px;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:none}
.steps{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.steps span{padding:5px 12px;border-radius:999px;background:#efede8;font-size:.8rem;font-weight:600;color:var(--muted)}
.steps span.on{background:var(--teal);color:#fff}
.room{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fcfbf8}
.bar{display:flex;align-items:end;gap:10px;height:140px;padding-top:10px}
.bar div{flex:1;background:var(--teal2);border-radius:6px 6px 0 0;position:relative;min-height:3px}
.bar div span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:.72rem;font-weight:700}
.barl{display:flex;gap:10px}.barl span{flex:1;text-align:center;font-size:.7rem;color:var(--muted)}

/* modal + toast */
#modal{position:fixed;inset:0;background:rgba(15,30,30,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:40px 14px}
#modal.on{display:flex}
#modal .box{background:#fff;border-radius:18px;max-width:640px;width:100%;padding:24px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.25)}
#modal .box.wide{max-width:860px}
#modal .x{position:absolute;right:14px;top:12px;border:none;background:#f1efe9;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:1.1rem}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;font-size:.9rem;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
footer{background:var(--ink);color:#c7d3d1;padding:36px 0;margin-top:50px;font-size:.88rem}
footer a{color:#fff}
.voucher{border:2px dashed var(--teal2);border-radius:16px;padding:20px;background:#fbfefe}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:.82rem;cursor:pointer;font-weight:600}
.chip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.notice{background:var(--ambersoft);border:1px solid #efd8a6;color:#6f4c12;border-radius:12px;padding:10px 14px;font-size:.88rem}
.notice.green{background:var(--greensoft);border-color:#bfe0c8;color:#21573a}
.notice.blue{background:var(--tealsoft);border-color:#c6dfe2;color:var(--teal)}
.loading{padding:80px 20px;text-align:center;color:var(--muted)}
.stars{color:#e0a526;letter-spacing:1px}
hr{border:none;border-top:1px solid var(--line);margin:16px 0}

/* nuove funzioni */
.lang{display:inline-flex;gap:2px;margin-right:4px}
.lang a{font-size:.75rem;font-weight:700;padding:4px 7px;border-radius:6px;cursor:pointer;color:var(--muted);text-decoration:none}
.lang a.on{background:var(--tealsoft);color:var(--teal)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calh{font-size:.75rem;font-weight:700;color:var(--muted);text-align:center;padding:4px 0}
.calc{background:#fff;border:1px solid var(--line);border-radius:8px;min-height:92px;padding:5px;overflow:hidden}
.calc.oggi{border-color:var(--coral)}
.calt{font-size:.7rem;line-height:1.25;background:var(--tealsoft);color:var(--teal);border-radius:4px;padding:2px 4px;margin-top:3px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calt.s{background:var(--teal);color:#fff;font-weight:600}
@media(max-width:700px){.calc{min-height:64px}.calt{font-size:.6rem}}
.tl{position:relative;height:16px;background:#f1efe9;border-radius:8px;margin:6px 0 2px}
.tl-b{position:absolute;top:2px;height:12px;border-radius:6px;background:var(--teal2)}
.tl-b.no{background:var(--red);opacity:.6}
.gift{background:linear-gradient(135deg,#0f4c5c,#1a6b7c);color:#fff;border-radius:18px;padding:28px;text-align:center}
.flyer{background:#fbf8f2;border-radius:12px;overflow:hidden}
.flyer .fl-img{height:240px}.flyer .fl-img svg{width:100%;height:100%;display:block}
.flyer .fl-body{padding:22px 26px}
.flyer .fl-k{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--coral)}
.flyer h1{margin:6px 0}.flyer .fl-d{font-weight:600;color:var(--ink2)}
.flyer ul{margin:12px 0;padding-left:18px;font-size:.9rem}
.flyer .fl-row{display:flex;justify-content:space-between;gap:18px;align-items:flex-end}
.flyer .fl-p{font-family:'Fraunces',serif;font-size:2.4rem;font-weight:700;color:var(--teal)}
.flyer .fl-qr{text-align:center}.flyer .fl-org{margin-top:16px;font-size:.85rem;color:var(--ink2);border-top:1px solid var(--line);padding-top:10px}
.doc{font-size:.92rem}.doc p{margin:8px 0}
@media print{body.printing #demobar,body.printing #root,body.printing #toast{display:none!important}body.printing #modal{position:static;background:none;padding:0;display:block}body.printing #modal .box{box-shadow:none;max-width:none;padding:0}body.printing #modal .x,body.printing #modal .row{display:none!important}}

.gd-layout{display:grid;grid-template-columns:300px 1fr;gap:26px;align-items:start}
.gd-list{display:flex;flex-direction:column;gap:8px;position:sticky;top:80px}
.gd-item{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;cursor:pointer;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line)}
.gd-item img{width:86px;height:50px;object-fit:cover;border-radius:7px;flex:none}
.gd-item span{display:flex;flex-direction:column;gap:2px;font-size:.88rem;line-height:1.25}
.gd-item.on{border-color:var(--teal);background:var(--tealsoft)}
.gd-video{width:100%;aspect-ratio:16/9;background:#0f2a2a;border-radius:14px;display:block}
.gd-steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:14px;counter-reset:st}
.gd-steps li{display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;counter-increment:st}
.gd-steps li img{width:100%;border-radius:8px;cursor:zoom-in;display:block}
.gd-steps li b{display:block;font-size:1.05rem;margin-bottom:4px}
.gd-steps li b::before{content:counter(st)". ";color:var(--coral)}
.gd-steps li p{margin:0;color:var(--ink2);font-size:.95rem}
@media(max-width:860px){.gd-layout{grid-template-columns:1fr}.gd-list{position:static;flex-direction:row;overflow-x:auto}.gd-item{min-width:240px}.gd-steps li{grid-template-columns:1fr}}
</style>
<link rel="stylesheet" href="/app-mobile.css">
</head>
<body>
<div id="demobar"></div>
<script src="config.js"></script>
<div id="root"><div class="loading">Caricamento della demo OVIGO…</div></div>
<div id="modal"><div class="box" id="mbox"></div></div>

"use strict";
/* ============ STATO E DATABASE ============ */
const COLL = ['tours','bookings','users','orgs','notifications','reviews','settings','proposte','messaggi','foto','eventi','codici','cassa','appelli'];
const S = {}; COLL.forEach(c => S[c] = {});
const loaded = {};
let DB = null, MODE = 'connessione';
const UI = { view:'home', param:null, sub:null, editing:false, pending:false, filters:{}, tab:'programma', draft:null, seatSel:[], bk:null };
const TODAY = new Date(); TODAY.setHours(0,0,0,0);

function uid(p){ return (p||'') + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

async function initDb(){
  let tries = 0;
  while(!(window.claude && window.claude.use) && tries < 30){ await new Promise(r=>setTimeout(r,100)); tries++; }
  try{ if(window.claude && window.claude.use) DB = await window.claude.use('db'); }catch(e){ DB = null; }
  if(!DB){ useLocal(); return; }
  MODE = 'cloud';
  const timer = setTimeout(()=>{ if(!Object.keys(loaded).length){ MODE='lento'; renderAll(); } }, 10000);
  COLL.forEach(c => {
    DB.collection(c).onSnapshot(snap => {
      const m = {};
      snap.docs.forEach(d => { if(d.exists) m[d.id] = norm(c, Object.assign({}, d.data(), {id:d.id})); });
      S[c] = m; loaded[c] = true;
      if(!snap.metadata.fromCache) clearTimeout(timer);
      scheduleRender();
    }, err => { console.warn('db', c, err); MODE = 'errore'; scheduleRender(); });
  });
}
function norm(c, o){ if(c==='bookings' && !o.partecipanti && o.camere) o.partecipanti = o.camere.flatMap(r=>r.occ||[]); return o; }
function useLocal(){
  MODE = 'locale';
  const raw = lsGet('ovigo-demo-data');
  if(raw){ try{ const d = JSON.parse(raw); COLL.forEach(c => { S[c] = d[c] || {}; Object.values(S[c]).forEach(o=>norm(c,o)); }); }catch(e){} }
  COLL.forEach(c => loaded[c] = true);
  scheduleRender();
}
function persistLocal(){ if(MODE==='locale') lsSet('ovigo-demo-data', JSON.stringify(S)); }

async function save(c, obj){
  obj = clone(obj); if(!obj.id) obj.id = uid(c[0]);
  S[c][obj.id] = obj; scheduleRender();
  if(DB){
    const body = clone(obj); delete body.id;
    try{ await DB.collection(c).doc(obj.id).set(body); }
    catch(e){
      if(e && e.code==='unavailable'){ await new Promise(r=>setTimeout(r,400+Math.random()*600)); try{ await DB.collection(c).doc(obj.id).set(body); return obj; }catch(e2){} }
      toast(e && e.code==='quota_exceeded' ? 'Spazio del database pieno' : 'Salvataggio non riuscito: controlla di avere accesso in modifica');
    }
  } else persistLocal();
  return obj;
}
async function remove(c, id){
  delete S[c][id]; scheduleRender();
  if(DB){ try{ await DB.collection(c).doc(id).delete(); }catch(e){ toast('Eliminazione non riuscita'); } } else persistLocal();
}
async function notify(to, testo, extra){
  return save('notifications', Object.assign({ id:uid('n'), to, testo, letto:false, createdAt:new Date().toISOString() }, extra||{}));
}

/* ============ UTENTE CORRENTE ============ */
let CUR = lsGet('ovigo-uid') || '';
function me(){ return S.users[CUR] || null; }
function myOrg(){ const u = me(); return u && u.orgId ? S.orgs[u.orgId] : null; }
function setUser(id){ CUR = id; lsSet('ovigo-uid', id); }
function settings(){ return S.settings.general || { commissione:4, accontoPct:30 }; }

/* ============ FORMATTAZIONE ============ */
const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const GG = ['dom','lun','mar','mer','gio','ven','sab'];
function d(s){ const x = new Date(s+'T00:00:00'); return isNaN(x) ? null : x; }
function fdate(s, opt){ const x = d(s); if(!x) return '—'; return (opt==='short' ? '' : GG[x.getDay()]+' ') + x.getDate()+' '+MESI[x.getMonth()].slice(0,3) + (opt==='y'||opt==='short' ? ' '+x.getFullYear() : ''); }
function frange(a,b){ const x=d(a), y=d(b); if(!x||!y) return '—'; if(x.getMonth()===y.getMonth()) return x.getDate()+'–'+y.getDate()+' '+MESI[x.getMonth()]+' '+y.getFullYear(); return x.getDate()+' '+MESI[x.getMonth()].slice(0,3)+' – '+y.getDate()+' '+MESI[y.getMonth()].slice(0,3)+' '+y.getFullYear(); }
function nights(a,b){ const x=d(a), y=d(b); return x&&y ? Math.round((y-x)/864e5) : 0; }
function eur(n){ n = Math.round((+n||0)*100)/100; return '€ '+n.toLocaleString('it-IT',{minimumFractionDigits: n%1?2:0, maximumFractionDigits:2}); }
function ago(iso){ const m = Math.round((Date.now()-new Date(iso))/6e4); if(m<1) return 'ora'; if(m<60) return m+' min fa'; const h=Math.round(m/60); if(h<24) return h+' h fa'; return Math.round(h/24)+' g fa'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function daysTo(s){ const x=d(s); return x ? Math.round((x-TODAY)/864e5) : 0; }

function seedOf(s){ let h=0; for(const c of String(s)) h=(h*31+c.charCodeAt(0))%997; return h+1; }

/* ============ LOGICA TOUR: posti, prezzi ============ */
function activeBookings(t){ return Object.values(S.bookings).filter(b => b.tourId===t.id && b.tipo==='prenotazione' && b.stato!=='annullata'); }
function capacity(t){ const m=t.mezzo||{}; return Math.max(0,(+m.posti||0) - (m.bloccati||[]).length); }
function occupied(t){ return activeBookings(t).reduce((s,b)=>s+(+b.pax||0),0); }
function freeSeats(t){ return Math.max(0, capacity(t)-occupied(t)); }
function confirmed(t){ return occupied(t) >= (+t.minPartecipanti||1); }
function takenSeats(t, exceptBooking){ const s=new Set(); activeBookings(t).forEach(b=>{ if(b.id!==exceptBooking) (b.seats||[]).forEach(x=>s.add(x)); }); return s; }
function roomsUsed(t){ const u={}; Object.keys(CAMERE).forEach(k=>u[k]=0); activeBookings(t).forEach(b=>(b.camere||[]).forEach(r=>{ if(u[r.tipo]!=null) u[r.tipo]+= r.condivisa?0.5:1; })); Object.keys(u).forEach(k=>u[k]=Math.ceil(u[k])); return u; }
function roomsFree(t){ const u=roomsUsed(t), f={}; Object.keys(CAMERE).forEach(k=>{ const c=(t.camere||{})[k]; f[k]=c && c.attiva!==false ? Math.max(0,(+c.n||0)-u[k]) : 0; }); return f; }
function vend(netto, markup){ return Math.round((+netto||0)*(1+(+markup||0)/100)); }
function busPP(t){ const m=t.mezzo||{}; const cap=capacity(t)||1; return vend((+m.netto||0)/cap, m.markup); }
function roomPP(t, tipo){ const c=(t.camere||{})[tipo]; return c ? vend(c.netto, c.markup) : 0; }
function personPrice(t, tipo, eta){
  let base;
  if(!hasRooms(t)) base = vend((t.quota||{}).netto, (t.quota||{}).markup) + (hasBus(t)?busPP(t):0);
  else base = roomPP(t, tipo) + busPP(t);
  const child = eta!=='' && eta!=null && +eta < 12;
  if(child){ const sc = +t.scontoBambino||0; if(!hasRooms(t)||tipo==='tripla'||tipo==='quadrupla') base = Math.round(base*(1-sc/100)); }
  return base;
}
function fromPrice(t){
  if(!hasRooms(t)) return personPrice(t,null,'');
  const opts = Object.keys(CAMERE).filter(k=>(t.camere||{})[k] && (t.camere[k].n>0)).map(k=>personPrice(t,k,''));
  const dbl = (t.camere||{}).doppia && t.camere.doppia.n>0 ? personPrice(t,'doppia','') : null;
  return dbl || (opts.length ? Math.min(...opts) : 0);
}
function bookingTotal(t, camere){
  let tot=0;
  (camere||[]).forEach(r => (r.occ||[]).forEach(p => { tot += personPrice(t, r.condivisa ? 'doppia' : r.tipo, p.eta); }));
  return tot;
}
function costiNetti(t){
  const out = { camere:0, mezzo:+((t.mezzo||{}).netto)||0, extra:(t.extra||[]).reduce((s,e)=>s+(+e.netto||0),0), quota:0 };
  if(!hasRooms(t)){ out.quota = (+((t.quota||{}).netto)||0) * capacity(t); }
  else Object.keys(CAMERE).forEach(k=>{ const c=(t.camere||{})[k]; if(c&&c.n) out.camere += (+c.n)*(+c.netto||0)*CAMERE[k].p*nightsOr1(t); });
  out.tot = out.camere+out.mezzo+out.extra+out.quota; return out;
}
function nightsOr1(t){ return 1; } // le quote camera sono già per l'intero soggiorno a persona
function tourRevenue(t){ return activeBookings(t).reduce((s,b)=>s+(+b.totale||0),0); }
function tourPaid(t){ return activeBookings(t).reduce((s,b)=>s+(+b.pagato||0),0); }
function orgRating(orgId){ const r=Object.values(S.reviews).filter(x=>x.orgId===orgId && x.visibilita!=='interna'); if(!r.length) return null; return { v:(r.reduce((s,x)=>s+(+x.voto||0),0)/r.length), n:r.length }; }
function publicTours(){ return Object.values(S.tours).filter(t => t.stato==='pubblicato' && !t.privato && S.orgs[t.orgId] && S.orgs[t.orgId].verificato && daysTo(t.dataInizio) >= 0).sort((a,b)=>a.dataInizio<b.dataInizio?-1:1); }
function tagsOf(t){ return [t.tema, t.area, t.festivita, stagione(t.dataInizio), t.tipo, TIPI[t.tipo], ...(t.tags||[]), ...(t.categorie||[]).map(c=>CATEGORIE[c]), ...(t.pubblico||[]).map(c=>PUBBLICO[c]), t.guida?t.guida.nome:''].filter(Boolean).join(' ').toLowerCase(); }

/* ============ FILTRI E RICERCA ============ */
function applyFilters(list, f){
  return list.filter(t => {
    if(f.mese && t.dataInizio.slice(0,7)!==f.mese) return false;
    if(f.data && t.dataInizio < f.data) return false;
    if(f.fest && f.fest.length && !f.fest.includes(t.festivita)) return false;
    if(f.stag && stagione(t.dataInizio)!==f.stag) return false;
    if(f.area && t.area!==f.area) return false;
    if(f.tema && t.tema!==f.tema) return false;
    if(f.max && fromPrice(t) > f.max) return false;
    if(f.famiglia && !(t.tags||[]).includes('famiglie') && !(t.pubblico||[]).includes('famiglie')) return false;
    if(f.tipo && t.tipo!==f.tipo) return false;
    if(f.cat && !(t.categorie||[]).includes(f.cat)) return false;
    if(f.pub && !(t.pubblico||[]).includes(f.pub)) return false;
    if(f.citta && !(fermataVicina(t, f.citta) && fermataVicina(t, f.citta).km<=60)) return false;
    if(f.esperto && !(t.guida && t.guida.tipo && t.guida.tipo!=='agenzia')) return false;
    if(f.q){ const hay=(t.titolo+' '+t.destinazione+' '+t.descrizione+' '+tagsOf(t)).toLowerCase(); if(!f.q.toLowerCase().split(/\s+/).every(w=>hay.includes(w))) return false; }
    return true;
  });
}
function parseSmart(txt){
  const s = ' '+txt.toLowerCase()+' ', f = {}, capiti = [];
  MESI.forEach((m,i)=>{ if(s.includes(' '+m)){ const y = i < TODAY.getMonth() ? TODAY.getFullYear()+1 : TODAY.getFullYear(); f.mese = y+'-'+String(i+1).padStart(2,'0'); capiti.push(m); } });
  const fk = { immacolata:['immacolata','8 dicembre'], natale:['natale','mercatini'], capodanno:['capodanno'], epifania:['epifania','befana'], carnevale:['carnevale'], pasqua:['pasqua'], '25aprile':['25 aprile','liberazione'], '1maggio':['1 maggio','primo maggio'], '2giugno':['2 giugno'] };
  Object.entries(fk).forEach(([k,ws])=>{ if(ws.some(w=>s.includes(w))){ f.fest=(f.fest||[]).concat(k); capiti.push(FEST[k]); } });
  if(/\bponte\b/.test(s) && !f.fest){ f.fest = ['immacolata','25aprile','1maggio','2giugno']; capiti.push('ponti'); }
  const tm = { mare:['mare','spiaggia','costa','isole'], montagna:['montagna','trekking','dolomiti'], neve:['neve','sci','inverno bianco'], citta:['città','citta','capitale','arte','musei'], campagna:['campagna','borghi','vino','enogastronom'] };
  Object.entries(tm).forEach(([k,ws])=>{ if(ws.some(w=>s.includes(w))){ f.tema=k; capiti.push(k); } });
  if(/famigli|bambin|figli/.test(s)){ f.famiglia=true; capiti.push('famiglie'); }
  if(/estero|europa|fuori italia/.test(s)){ f.area='estero'; capiti.push('estero'); } else if(/italia/.test(s)){ f.area='italia'; capiti.push('Italia'); }
  const m = s.match(/(sotto|meno di|max|massimo|entro)\s*(i|di)?\s*€?\s*(\d{2,5})/); if(m){ f.max=+m[3]; capiti.push('max '+eur(f.max)); }
  ['autunno','inverno','primavera','estate'].forEach(k=>{ if(s.includes(k)){ f.stag=k; capiti.push(k); } });
  const tk = { crociera:['crociera','nave'], moto:['moto'], treno:['treno'], vela:['vela','barca'], camper:['camper'], bici:['bici','cicloturismo'], evento:['concerto','opera','partita','evento'], soggiorno:['villaggio','terme','soggiorno'], cammino:['cammino','a piedi'] };
  Object.entries(tk).forEach(([k,ws])=>{ if(ws.some(w=>s.includes(w))){ f.tipo=k; capiti.push(TIPI[k]); } });
  const ck = { spirito:['pellegrin','lourdes','santuario','spiritual','giubileo'], benessere:['terme','benessere','yoga','spa'], gusto:['vino','cibo','gastronom','degustaz'], foto:['fotograf'], arte:['arte','musei','cultura'] };
  Object.entries(ck).forEach(([k,ws])=>{ if(ws.some(w=>s.includes(w))){ f.cat=k; capiti.push(CATEGORIE[k]); } });
  const pk = { over60:['over 60','anziani','pensionati','senior'], donne:['solo donne','tra donne'], accessibile:['accessibil','disabil','sedia a rotelle'], scuole:['scuola','gita scolastica','studenti'], aziende:['aziend','team building','incentive'], giovani:['giovani','ventenni'], single:['da solo','da sola','single'] };
  Object.entries(pk).forEach(([k,ws])=>{ if(ws.some(w=>s.includes(w))){ f.pub=k; capiti.push(PUBBLICO[k]); } });
  if(/espert|fotografo|archeolog|sommelier|guida alpina|influencer|creator/.test(s)){ f.esperto=true; capiti.push('con un esperto'); }
  return { f, capiti };
}

/* ============ RENDER PRINCIPALE ============ */
function renderAll(){
  if(typeof applyTipiExtra==='function') applyTipiExtra();
  if(typeof migrateCruise==='function') migrateCruise();
  renderBar();
  const root = document.getElementById('root');
  if(!loaded.tours && MODE!=='locale'){ root.innerHTML = header()+'<div class="loading">Carico i viaggi…</div>'; return; }
  const u = me();
  let html;
  if(UI.view==='cliente'){ html = u && u.ruolo==='cliente' ? header()+viewCliente() : header()+needLogin('cliente'); }
  else if(UI.view==='crm'){ html = u && u.ruolo==='organizzatore' ? header()+viewCrm() : header()+needLogin('organizzatore'); }
  else if(UI.view==='admin'){ html = u && u.ruolo==='admin' ? header()+viewAdmin() : header()+needLogin('super admin'); }
  else if(UI.view==='tour'){ html = header()+viewTour(UI.param)+footer(); }
  else if(UI.view==='org'){ html = header()+viewOrg(UI.param)+footer(); }
  else if(UI.view==='community'){ html = header()+viewCommunity()+footer(); }
  else if(UI.view==='staff'){ html = u && u.ruolo==='accompagnatore' ? header()+viewStaff() : header()+needLogin('accompagnatore'); }
  else if(UI.view==='cerca'){ html = header()+viewSearch()+footer(); }
  else if(UI.view==='guide'){ html = header()+viewGuide(UI.param)+footer(); }
  else html = header()+viewHome()+footer();
  root.innerHTML = html;
  postRender();
  if(UI.after){ const f=UI.after; UI.after=null; f(); }
}
function needLogin(r){ return `<div class="wrap"><div class="empty" style="margin-top:40px"><h3>Area riservata</h3><p>Per vedere questa sezione scegli un account <b>${r}</b> dalla barra demo in alto.</p></div></div>`; }

function doSearch(){ const f={}; const m=val('f_mese'), fe=val('f_fest'), st=val('f_stag'), q=val('f_q'); if(m) f.mese=m; if(fe) f.fest=[fe]; if(st) f.stag=st; if(q) f.q=q; if(val('f_tipo')) f.tipo=val('f_tipo'); if(val('f_cat')) f.cat=val('f_cat'); if(val('f_pub')) f.pub=val('f_pub'); if(val('f_data')) f.data=val('f_data'); if(val('f_citta')) f.citta=val('f_citta'); searchBy(f); }

function viewSearch(){
  const f = UI.filters||{}, res = applyFilters(publicTours(), f);
  const chips = [];
  if(f.mese){ const [y,m]=f.mese.split('-'); chips.push(MESI[+m-1]+' '+y); }
  if(f.fest) chips.push(f.fest.map(k=>FEST[k]).join(', '));
  if(f.stag) chips.push('Tour '+STAG[f.stag].toLowerCase());
  if(f.area) chips.push(f.area==='italia'?'Italia':'Estero');
  if(f.citta) chips.push('partenza vicino a '+f.citta); if(f.tema) chips.push(f.tema); if(f.famiglia) chips.push('per famiglie'); if(f.max) chips.push('fino a '+eur(f.max)); if(f.q) chips.push('«'+f.q+'»'); if(f.tipo) chips.push(TIPI[f.tipo]); if(f.cat) chips.push(CATEGORIE[f.cat]); if(f.pub) chips.push(PUBBLICO[f.pub]); if(f.esperto) chips.push('con esperto o creator');
  return `<div style="background:var(--teal);padding:24px 0 30px"><div class="wrap">${searchForm(f)}</div></div>
  <section class="block"><div class="wrap">
    ${UI.smart?`<div class="notice blue" style="margin-bottom:14px">✨ Ho capito: <b>${esc(UI.smart.capiti.join(' · ')||'nessun criterio riconosciuto')}</b>. <span class="small">(Ricerca in linguaggio naturale, versione demo)</span></div>`:''}
    <div class="sechead"><div><h2>${res.length} ${res.length===1?'partenza trovata':'partenze trovate'}</h2><div class="chips">${chips.map(c=>`<span class="chip on">${esc(c)}</span>`).join('')}</div></div>${chips.length?`<button class="btn" onclick="searchBy({})">Azzera filtri</button>`:''}</div>
    ${searchModeBar()}${f.citta&&!UI.cal?cittaRisultati(res, f.citta):''}
    ${UI.cal?calendario(res):res.length?`<div class="grid g3">${res.map(tourCard).join('')}</div>`:`<div class="empty">Nessun tour con questi criteri. Prova ad allargare la ricerca o <a onclick="searchBy({})" style="cursor:pointer">guarda tutte le partenze</a>.</div>`}
  </div></section>`;
}

/* ============ MAPPA POSTI PULLMAN ============ */
function busMap(t, sel, interactive, exceptBooking, mineSeats){
  const m = t.mezzo||{}, n = +m.posti||0, blk = new Set(m.bloccati||[]), taken = takenSeats(t, exceptBooking), mine = new Set(mineSeats||[]);
  if(!n) return '<p class="muted small">Mezzo non ancora definito.</p>';
  const rows = []; let s = 1;
  const nRows = (n>=5 && n%4===1) ? (n-5)/4 : Math.ceil(n/4); // ultima fila da 5 se i posti lo permettono
  for(let r=0; r<nRows; r++){ const row=[]; for(let c=0;c<4 && s<=n;c++) row.push(s++); rows.push(row); }
  const last = []; while(s<=n) last.push(s++);
  const seat = x => { const cls = mine.has(x)?'mine':blk.has(x)?'blk':taken.has(x)?'occ':sel.includes(x)?'sel':''; const dis = cls==='occ'||cls==='blk'||cls==='mine' || !interactive; return `<button class="seat ${cls}" ${dis?'disabled':''} onclick="pickSeat(${x})" title="Posto ${x}">${x}</button>`; };
  return `<div style="display:inline-block"><div class="bus"><div class="front"><span>🧑‍✈️ Autista</span><span>Porta 🚪</span></div>
    ${rows.map(r=>`<div class="seatrow">${r.slice(0,2).map(seat).join('')}<span></span>${r.slice(2).map(seat).join('')}</div>`).join('')}
    ${last.length?`<div class="seatrow last">${last.map(seat).join('')}</div>`:''}
  </div>
  <div class="legend"><span><i style="background:#cfe7d6"></i>Libero</span><span><i style="background:#c9c5bc"></i>Occupato</span><span><i style="background:#f3dfb4"></i>Riservato staff</span>${interactive?'<span><i style="background:var(--coral)"></i>Tua scelta</span>':''}${mine.size?'<span><i style="background:var(--teal)"></i>I tuoi posti</span>':''}</div></div>`;
}
function pickSeat(x){
  const b = UI.bk; if(!b) return;
  const i = UI.seatSel.indexOf(x);
  if(i>=0) UI.seatSel.splice(i,1);
  else { if(UI.seatSel.length >= b.pax){ UI.seatSel.shift(); } UI.seatSel.push(x); }
  bookingStep(2);
}

function validateStep1(t, b, u){
  if(!u && (!b.reg.nome || !b.reg.cognome || !/.+@.+\..+/.test(b.reg.email))) return 'Inserisci nome, cognome ed email validi';
  if(!b.pax) return 'Aggiungi almeno un partecipante';
  if(b.camere.some(r=>r.occ.some(o=>!o.nome.trim()))) return 'Inserisci il nome di tutti i partecipanti';
  if(b.pax > freeSeats(t)) return 'Posti insufficienti: ne restano '+freeSeats(t);
  return '';
}
function autoSeats(){ const b=UI.bk, t=S.tours[b.tourId], m=t.mezzo||{}, blk=new Set(m.bloccati||[]), tk=takenSeats(t); UI.seatSel=[]; for(let s=1; s<=(+m.posti||0) && UI.seatSel.length<b.pax; s++) if(!blk.has(s)&&!tk.has(s)) UI.seatSel.push(s); bookingStep(2); }
async function ensureUser(reg){
  let u = me(); if(u) return u;

  if(ex){ setUser(ex.id); return ex; }
  u = await save('users', { id:uid('u'), nome:reg.nome, cognome:reg.cognome, email:reg.email, ruolo:'cliente', emailVerificata:false, createdAt:new Date().toISOString(), profilo:{} });
  setUser(u.id); return u;
}
async function confirmBooking(stato){
  const b = UI.bk, t = S.tours[b.tourId];
  if(b.pax > freeSeats(t)){ toast('Nel frattempo i posti sono finiti'); return; }

  processInvites(b);
  const TT = bkTotals(t,b), tot = TT.tot, acc = TT.acc;
  const buono = TT.codice ? b.codice : '';
  const isRate = stato==='rate', isQuota = stato==='quota', isSalv = stato==='salvadanaio'; if(isRate||isQuota||isSalv) stato = 'acconto';
  const quote = isQuota ? quoteDivise(t, b, tot) : null, piano = isSalv ? pianoSalvadanaio(t, tot) : null;
  const bk = await save('bookings', { id:uid('b'), tourId:t.id, orgId:t.orgId, userId:u.id, tipo:'prenotazione', stato, pax:b.pax,
    camere: b.camere.filter(r=>r.tipo!=='posto').map(r=>({tipo:r.condivisa?'doppia':r.tipo, condivisa:!!r.condivisa, mezziPropri:!!r.mezziPropri, occ:r.occ})),
    partecipanti: b.camere.flatMap(r=>r.occ), seats: UI.seatSel.slice().sort((a,c)=>a-c), punto: b.punto, note:b.note||'', buono,
    totale: tot, pagato: isQuota?quote[0].importo : isSalv?piano[0].importo : isRate?TT.rate[0].importo : stato==='saldata'?tot : stato==='acconto'?acc : 0, rate: isSalv?piano : isRate?TT.rate:null, piano: isSalv?'salvadanaio':'', quote, scontoGruppo: TT.sgrPP||0, assicurazioni:TT.assList, sconto:TT.sconto, documenti:{}, canale:'online', trattamento:b.trattamento||'', extraScelti:TT.extraScelti, cf:b.cf||'', createdAt:new Date().toISOString() });
  await notifyInvites(bk);
  if(TT.codice && TT.codice.monouso) await save('codici', Object.assign({}, S.codici[TT.codice.id], {usato:true, usatoDa:u.id, usatoIl:new Date().toISOString()}));
  if(quote) for(const q of quote.slice(1)) if(q.invito){ const dest = Object.values(S.users).find(x=>(x.email||'').toLowerCase()===q.invito); if(dest) await notify('user:'+dest.id, `💶 ${u.nome} ti ha riservato un posto su «${t.titolo}»: la tua quota è ${eur(q.importo)}. Pagala dal link: #paga-${q.codice}`, {tourId:t.id}); }
  for(const z of Object.values(S.bozze).filter(z=>z.userId===u.id&&z.tourId===t.id)) await remove('bozze', z.id);
  if(b.cf && !u.cf) await save('users', Object.assign({}, S.users[u.id]||u, {cf:b.cf}));
  await notify('org:'+t.orgId, `Nuova prenotazione di ${u.nome} ${u.cognome||''} per «${t.titolo}» (${b.pax} pax, ${eur(tot)})`, {tourId:t.id, bookingId:bk.id});
  await notify('user:'+u.id, stato==='bloccata' ? `Posto bloccato a 0 € per «${t.titolo}». Ti avviseremo quando la partenza sarà confermata.` : `Prenotazione confermata per «${t.titolo}». Pagato: ${eur(bk.pagato)}.`, {tourId:t.id, bookingId:bk.id});
  if((t.documenti||[]).length) await notify('user:'+u.id, `Ricordati di caricare i documenti per «${t.titolo}»: ${t.documenti.join(', ')}.`, {tourId:t.id, bookingId:bk.id});
  await checkConfirmation(t.id);
  await checkScaglioni(t.id);
  openModal(`<h2>${stato==='bloccata'?'Posto bloccato!':'Prenotazione fatta!'}</h2><p>${stato==='bloccata'?'Non hai pagato nulla. Ti avviseremo appena il gruppo raggiunge il minimo.':'Hai pagato '+eur(bk.pagato)+' di '+eur(tot)+'.'}</p><p class="small muted">Trovi tutto nella tua area cliente: posti, documenti da caricare, voucher.</p><div class="row"><button class="btn pri" onclick="closeModal();go('cliente')">Vai alla mia area</button><button class="btn" onclick="closeModal()">Resta qui</button></div>`);
  UI.bk = null;
}
async function checkConfirmation(tid){
  const t = S.tours[tid]; if(!t || t.confermatoIl) return;
  if(occupied(t) >= (+t.minPartecipanti||1)){
    await save('tours', Object.assign({}, t, { confermatoIl:new Date().toISOString() }));
    const users = [...new Set(activeBookings(t).map(b=>b.userId))];
    for(const id of users) await notify('user:'+id, `🎉 Partenza confermata per «${t.titolo}»! Se avevi bloccato il posto a 0 €, ora puoi pagare l'acconto.`, {tourId:t.id});
    await notify('org:'+t.orgId, `Il tour «${t.titolo}» ha raggiunto il minimo di ${t.minPartecipanti} partecipanti.`, {tourId:t.id});
  }
}

async function payBooking(id, how){

function cancelBooking(id){

function dset(path, v, kind){
  const parts = path.split('.'); let o = UI.draft;
  for(let i=0;i<parts.length-1;i++){ const k=parts[i]; if(o[k]==null) o[k] = /^\d+$/.test(parts[i+1])?[]:{}; o=o[k]; }
  if(kind==='n') v = v===''?0:+v; else if(kind==='b') v = !!v; else if(kind==='list') v = v.split('\n').map(x=>x.trim()).filter(Boolean); else if(kind==='nums') v = v.split(/[,\s]+/).map(x=>+x).filter(x=>x>0);
  o[parts[parts.length-1]] = v;
  updateSummary();
}
function inp(path, label, opt){
  opt = opt||{}; const v = path.split('.').reduce((a,k)=>a==null?'':a[k], UI.draft);
  const kind = opt.kind||(opt.type==='number'?'n':'');
  let show = v; if(kind==='list') show = (v||[]).join('\n'); if(kind==='nums') show = (v||[]).join(', ');
  const h = `oninput="dset('${path}', this.value, '${kind}')"`;
  let field;
  if(opt.sel) field = `<select onchange="dset('${path}', this.value, '${kind}');${opt.rerender?'renderAll()':''}">${opt.sel.map(([k,l])=>`<option value="${esc(k)}" ${String(v)===String(k)?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  else if(opt.area || kind==='list') field = `<textarea ${h} placeholder="${esc(opt.ph||'')}">${esc(show)}</textarea>`;
  else field = `<input type="${opt.type||'text'}" value="${esc(show)}" ${h} placeholder="${esc(opt.ph||'')}" ${opt.type==='number'?'step="any"':''}>`;
  return `<div class="field"><label>${label}</label>${field}${opt.help?`<div class="tiny muted">${opt.help}</div>`:''}</div>`;
}

function quoteBox(t){
  const hotel = hasRooms(t), c = costiNetti(t), comm = settings().commissione||4;
  let rows = '', fullRev = 0;

  else { const pp = personPrice(t,null,''); fullRev = pp*capacity(t); rows = `<tr><td>Adulto</td><td class="num">${eur((t.quota||{}).netto)}</td><td class="num">${eur(vend((t.quota||{}).netto,(t.quota||{}).markup))}</td><td class="num">${hasBus(t)?eur(busPP(t)):'—'}</td><td class="num"><b>${eur(pp)}</b></td><td class="num">${eur(c.quota)}</td></tr>`; }
  const seatsByRooms = hotel ? Object.keys(CAMERE).reduce((s,k)=>s+((t.camere[k]||{}).n||0)*CAMERE[k].p,0) : capacity(t);
  const margin = fullRev - c.tot;
  return `<h3>Quote pubblicate</h3><div class="card" style="overflow-x:auto"><table><tr><th>Sistemazione</th><th class="num">Netto pp</th><th class="num">Vendita pp</th><th class="num">Trasporto pp</th><th class="num">Quota pubblicata</th><th class="num">Costo struttura</th></tr>${rows}</table></div>
  ${hotel && seatsByRooms!==capacity(t)?`<div class="notice small" style="margin-top:10px">⚠️ I letti caricati (${seatsByRooms}) non corrispondono ai posti paganti sul mezzo (${capacity(t)}). Il contatore deve combaciare.</div>`:''}
  <h3 style="margin-top:18px">Amministrazione (a gruppo pieno)</h3>
  <table><tr><td>Costo strutture</td><td class="num">${eur(c.camere+c.quota)}</td></tr><tr><td>Costo trasporto</td><td class="num">${eur(c.mezzo)}</td></tr><tr><td>Costi extra</td><td class="num">${eur(c.extra)}</td></tr><tr><td><b>Totale costi netti</b></td><td class="num"><b>${eur(c.tot)}</b></td></tr>
  <tr><td>Ricavo a gruppo pieno</td><td class="num">${eur(fullRev)}</td></tr><tr><td>Commissione OVIGO ${comm}%</td><td class="num">−${eur(fullRev*comm/100)}</td></tr>
  <tr><td><b>Margine stimato</b></td><td class="num"><b style="color:${margin-fullRev*comm/100>=0?'var(--green)':'var(--red)'}">${eur(margin-fullRev*comm/100)}</b> (${fullRev?Math.round((margin-fullRev*comm/100)/fullRev*100):0}%)</td></tr>
  <tr><td>Pareggio (persone)</td><td class="num">${fullRev&&capacity(t)?Math.ceil(c.tot/((fullRev*(1-comm/100))/capacity(t))):'—'} su ${capacity(t)}</td></tr></table>${priceHint(t)}`;
}
function summaryBox(t, err){
  const c = costiNetti(t);
  return `<b>Riepilogo</b><div class="small" style="margin-top:8px">${TIPI[t.tipo]} · ${nights(t.dataInizio,t.dataFine)+1} giorni<br>Posti paganti: <b>${capacity(t)}</b> · minimo ${t.minPartecipanti||0}<br>Quota da: <b>${eur(fromPrice(t))}</b><br>Costi netti: ${eur(c.tot)}</div>
  ${err.length?`<div class="notice small" style="margin-top:10px"><b>Per pubblicare manca:</b><br>${err.map(e=>'· '+e).join('<br>')}</div>`:'<div class="notice green small" style="margin-top:10px">Pronto per la pubblicazione</div>'}`;

function tourErrors(t){
  const e = [];
  if(!t.titolo) e.push('il titolo'); if(!t.dataInizio||!t.dataFine||t.dataFine<t.dataInizio) e.push('date valide');
  if(!(t.programma||[]).length) e.push('il programma giorno per giorno');
  if(!capacity(t)) e.push('i posti sul mezzo');
  if(!fromPrice(t)) e.push('le quote');
  if(hasBus(t) && !(t.punti||[]).some(p=>p.luogo)) e.push('almeno un punto di raccolta');
  return e;
}

function genDays(){
  const t = UI.draft, a = d(t.dataInizio), b = d(t.dataFine); if(!a||!b||b<a){ toast('Imposta prima date valide'); return; }
  const old = t.programma||[], out = [];
  for(let x=new Date(a), i=0; x<=b; x.setDate(x.getDate()+1), i++){ const iso = x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); out.push(Object.assign({titolo:i===0?'Partenza':'', testo:'', hotel: x<b && (t.hotel||[]).length ? '0':''}, old[i]||{}, {data:iso})); }

async function saveTour(stato){
  const t = UI.draft;
  if(stato==='pubblicato'){ const e = tourErrors(t); if(e.length){ toast('Per pubblicare manca: '+e.join(', ')); return; } }
  const wasNew = !S.tours[t.id], wasPub = S.tours[t.id] && S.tours[t.id].stato==='pubblicato';
  t.stato = stato==='bozza' && wasPub ? 'pubblicato' : stato;
  t.aggiornatoIl = new Date().toISOString();
  await save('tours', t);
  if(t.stato==='pubblicato') await afterPublish(t);
  if(t.stato==='pubblicato' && !wasPub){
    const fans = Object.values(S.bookings).filter(b=>b.tipo==='desiderio' && S.tours[b.tourId] && S.tours[b.tourId].orgId===t.orgId && S.tours[b.tourId].tema===t.tema && b.tourId!==t.id);
    for(const u of [...new Set(fans.map(b=>b.userId))]) await notify('user:'+u, `Nuovo tour simile a uno dei tuoi desideri: «${t.titolo}» (${frange(t.dataInizio,t.dataFine)})`, {tourId:t.id});
  }
  toast(t.stato==='pubblicato' ? (wasPub?'Tour aggiornato':'Tour pubblicato!') : 'Bozza salvata');
  if(wasNew) UI.draft = clone(t);
}

  let camere = [], pax;

  else { pax = +val('pb_pax')||1; camere=[{tipo:'posto', occ:[{nome:nome+' '+cognome,eta:''}, ...Array.from({length:pax-1},(_,i)=>({nome:altri[i]||'Partecipante '+(i+2),eta:''}))]}]; }
  if(pax>freeSeats(t)){ toast('Posti insufficienti'); return; }
  const m=t.mezzo||{}, blk=new Set(m.bloccati||[]), tk=takenSeats(t), seats=[]; for(let s=1;s<=(+m.posti||0)&&seats.length<pax;s++) if(!blk.has(s)&&!tk.has(s)) seats.push(s);
  const tot = bookingTotal(t, camere), acc = +val('pb_acc')||0;
  await save('bookings', {id:uid('b'), tourId:tid, orgId:t.orgId, userId:u.id, tipo:'prenotazione', stato: val('pb_tipo')==='opzione'&&!acc?'bloccata':acc>=tot?'saldata':acc?'acconto':'bloccata', pax, camere:camere.filter(r=>r.tipo!=='posto'), partecipanti:camere.flatMap(r=>r.occ), seats:hasBus(t)?seats:[], punto:0, totale:tot, pagato:acc, documenti:{}, canale:UI.rivendita?'rete: '+((S.orgs[UI.rivendita]||{}).nome||''):'telefono', rivenditoreOrgId:UI.rivendita||null, scadenzaOpzione: val('pb_tipo')==='opzione'&&!acc ? val('pb_scad') : '', commRivendita: UI.rivendita ? (+t.commRivendita||0) : 0, createdAt:new Date().toISOString()});
  if(UI.rivendita) await notify('org:'+t.orgId, `🤝 ${(S.orgs[UI.rivendita]||{}).nome} ha venduto ${pax} posti su «${t.titolo}» (commissione ${t.commRivendita||0}%)`, {tourId:tid});
  UI.rivendita = null;
  await notify('user:'+u.id, `L'agenzia ha registrato la tua prenotazione per «${t.titolo}». Puoi caricare i documenti dalla tua area OVIGO.`, {tourId:tid});
  await checkConfirmation(tid);
  closeModal(); toast('Prenotazione registrata');
}

async function pairRoom(bid){
  const other = val('pair_'+bid); if(!other){ toast('Scegli con chi abbinare'); return; }
  const a = clone(S.bookings[bid]), b = clone(S.bookings[other]);
  const ra = a.camere.find(r=>r.condivisa&&!r.abbinataCon), rb = b.camere.find(r=>r.condivisa&&!r.abbinataCon);
  ra.abbinataCon = b.id; rb.abbinataCon = a.id; a.abbinamento = rb.occ[0].nome; b.abbinamento = ra.occ[0].nome;
  await save('bookings', a); await save('bookings', b);
  const t = S.tours[a.tourId];
  await notify('user:'+a.userId, `Abbiamo trovato il tuo compagno di stanza per «${t.titolo}»: ${a.abbinamento}. Conferma dalla tua area.`, {tourId:t.id});
  await notify('user:'+b.userId, `Abbiamo trovato il tuo compagno di stanza per «${t.titolo}»: ${b.abbinamento}. Conferma dalla tua area.`, {tourId:t.id});
  toast('Camera doppia assegnata');
}
function copyRooming(tid){
  const t = S.tours[tid], lines = ['Camera;Tipo;Nominativi;Minori'];
  let i = 1; activeBookings(t).forEach(b=>(b.camere||[]).forEach(r=>{ if(r.condivisa && r.abbinataCon && b.id > r.abbinataCon) return; const names = r.occ.map(x=>x.nome).concat(r.condivisa&&r.abbinataCon ? [b.abbinamento] : []); lines.push(`${i++};${r.condivisa?'Doppia condivisa':CAMERE[r.tipo]?.l};${names.join(', ')};${r.occ.filter(x=>x.eta!=='' && x.eta!=null).map(x=>x.nome+' '+x.eta).join(', ')}`); }));
  copyText(lines.join('\n'));
}

/* ============ AI (Claude dentro la pagina) ============ */
let SAMPLE = null;
async function initAI(){
  let tries = 0;
  while(!(window.claude && window.claude.use) && tries < 30){ await new Promise(r=>setTimeout(r,100)); tries++; }
  try{ if(window.claude && window.claude.use) SAMPLE = await window.claude.use('sample'); }catch(e){ SAMPLE = null; }
}
function aiErr(e){ const c = e && e.code; return c==='not_granted' ? 'Non hai autorizzato l\'uso dell\'AI per questa pagina.' : c==='rate_limited' ? 'Troppe richieste ravvicinate: riprova tra poco.' : c==='sampling_disabled' ? 'AI non disponibile per questo account.' : c==='cancelled' ? '' : 'L\'assistente non ha risposto. Riprova.'; }
function tourContext(t){
  const org = S.orgs[t.orgId]||{};
  const prezzi = hasRooms(t) ? Object.keys(CAMERE).filter(k=>(t.camere||{})[k]&&t.camere[k].n>0).map(k=>roomName(t,k)+': '+eur(personPrice(t,k,''))+' a persona').join('; ') : 'Adulto: '+eur(personPrice(t,null,''));
  return [
    'Tour: '+t.titolo+' ('+TIPI[t.tipo]+'), organizzato da '+(org.nome||''),
    'Date: '+frange(t.dataInizio,t.dataFine),
    'Descrizione: '+(t.descrizione||''),
    'Programma: '+(t.programma||[]).map((g,i)=>'Giorno '+(i+1)+' '+(g.titolo||'')+': '+(g.testo||'')).join(' | '),
    'Hotel: '+(t.hotel||[]).map(h=>h.nome+' '+(h.stelle||'')+' stelle, '+(h.zona||'')).join('; '),
    'Trattamento: '+(t.trattamento||''),
    'Prezzi: '+prezzi+(t.scontoBambino?'. Bambini sotto 12 anni in 3°/4° letto sconto '+t.scontoBambino+'%':''),
    'Punti di ritrovo: '+(t.punti||[]).map(p=>p.luogo+' ore '+(p.orario||'da stabilire')).join('; '),
    'Trasporto: '+((t.mezzo||{}).descrizione||'')+' '+JSON.stringify(t.voli||{}),
    'Comprende: '+(t.comprende||[]).join(', '), 'Non comprende: '+(t.nonComprende||[]).join(', '),
    'Documenti richiesti: '+(t.documenti||[]).join(', '),
    'Info utili: '+Object.entries(t.info||{}).map(([k,v])=>k+': '+v).join('; ')+(t.accessibilita?' Accessibilità: '+t.accessibilita:''),
    'Posti liberi: '+freeSeats(t)+'. Minimo per partire: '+t.minPartecipanti+', iscritti: '+occupied(t)+', conferma entro '+fdate(t.dataConferma,'y'),
    'Condizioni: '+(t.condizioni||''),

function assistantBox(t){

async function askTour(tid){
  const q = val('aiq'); if(!q || !SAMPLE) return;
  const t = S.tours[tid]; UI.chat = UI.chat||{}; const ch = UI.chat[tid] = UI.chat[tid]||[];
  ch.push({role:'user', content:q}); ch.push({role:'assistant', content:'Sto pensando…'});
  renderAll();
  const box = document.getElementById('aichat'); const bubbles = box ? box.querySelectorAll('span') : []; const last = bubbles[bubbles.length-1];
  const rules = 'Sei l\'assistente clienti di OVIGO per un viaggio di gruppo. Rispondi in italiano, in modo cordiale e breve (massimo 5 frasi), SOLO in base ai dati del tour qui sotto. Se l\'informazione non c\'è, dillo e suggerisci di scrivere all\'organizzatore con il pulsante Richiedi disponibilità. Non inventare prezzi o orari.\n\nDATI DEL TOUR:\n'+tourContext(t);
  const turns = [{role:'user', content:rules}].concat(ch.slice(0,-1).slice(-8).map(m=>({role:m.role, content:m.content})));
  try{
    const r = await SAMPLE(turns, { cache:false, modelTier:'quick', onText:({text})=>{ if(last) last.textContent = text; } });
    ch[ch.length-1].content = r.text;
  }catch(e){ ch[ch.length-1].content = (e && e.text) || aiErr(e) || '…'; }
  if(UI.view==='tour' && UI.tab==='assistente') renderAll();
}

function openImport(){
  openModal(`<h2>✨ Importa il programma</h2><p class="small muted">Incolla il testo del programma (da un PDF, una mail o il sito del fornitore). ${SAMPLE?'Claude lo legge e compila giorni, hotel, cosa comprende e cosa no.':'AI non disponibile qui: uso una lettura semplice per giorni.'}</p>
  <textarea id="imp_txt" style="min-height:220px" placeholder="1° giorno – Roma / Firenze: partenza alle 6:30…\n2° giorno – Firenze: visita guidata…"></textarea>
  <div class="row" style="margin-top:10px"><button class="btn pri" id="imp_btn" onclick="runImport()">Analizza e compila</button><span class="small muted" id="imp_st"></span></div>`, true);
}
async function runImport(){
  const txt = val('imp_txt'); if(!txt){ toast('Incolla un testo'); return; }
  const st = document.getElementById('imp_st'), btn = document.getElementById('imp_btn'); btn.disabled = true; st.textContent = 'Analizzo…';
  let data = null;
  if(SAMPLE){
    try{
      data = await SAMPLE.json('Estrai da questo programma di viaggio di gruppo i dati strutturati. Rispondi SOLO con un oggetto JSON con queste chiavi: {"titolo": string, "descrizione": string (2-3 frasi), "giorni": [{"titolo": string, "testo": string}], "hotel": [{"nome": string, "stelle": number, "zona": string}], "trattamento": string, "comprende": [string], "nonComprende": [string]}. Usa stringhe vuote o liste vuote se un dato manca. Scrivi in italiano.\n\nPROGRAMMA:\n'+txt.slice(0,12000), { modelTier:'default' });
    }catch(e){ st.textContent = aiErr(e)+' Uso la lettura semplice.'; }
  }
  if(!data || !Array.isArray(data.giorni)){
    const parts = txt.split(/\n(?=\s*(?:\d+\s*[°ºo]?\s*giorno|giorno\s*\d+))/i).map(s=>s.trim()).filter(Boolean);
    data = { giorni: parts.map(p=>{ const [h,...r] = p.split('\n'); return { titolo:h.replace(/^\s*\d+\s*[°ºo]?\s*giorno\s*[-–:]?\s*|^giorno\s*\d+\s*[-–:]?\s*/i,'').trim(), testo:r.join(' ').trim() }; }) };
  }
  const t = UI.draft;
  if(data.titolo && !t.titolo) t.titolo = data.titolo;
  if(data.descrizione && !t.descrizione) t.descrizione = data.descrizione;
  if(Array.isArray(data.hotel) && data.hotel.length && !(t.hotel||[]).some(h=>h.nome)) t.hotel = data.hotel.map(h=>({nome:h.nome||'', stelle:String(h.stelle||3), zona:h.zona||'', link:'', note:''}));
  if(data.trattamento){ const m = TRATT.find(x=>data.trattamento.toLowerCase().includes(x.toLowerCase().split(' ')[0])); if(m) t.trattamento = m; }
  if(Array.isArray(data.comprende) && data.comprende.length) t.comprende = data.comprende;
  if(Array.isArray(data.nonComprende) && data.nonComprende.length) t.nonComprende = data.nonComprende;
  const start = d(t.dataInizio) || TODAY;
  t.programma = data.giorni.map((g,i)=>{ const x = new Date(start.getTime()+i*864e5); const iso = x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); return { data:iso, titolo:g.titolo||'', testo:g.testo||'', hotel: i<data.giorni.length-1 && (t.hotel||[]).length ? '0' : '' }; });
  if(t.programma.length){ const last = new Date(start.getTime()+(t.programma.length-1)*864e5); t.dataFine = last.getFullYear()+'-'+String(last.getMonth()+1).padStart(2,'0')+'-'+String(last.getDate()).padStart(2,'0'); }
  closeModal(); UI.etab='programma'; renderAll(); toast(`Importati ${t.programma.length} giorni${SAMPLE?' con l\'AI':''}: controlla e correggi`);
}
function priceHint(t){
  const days = nights(t.dataInizio,t.dataFine)+1, mine = fromPrice(t);
  const sim = Object.values(S.tours).filter(x=>x.id!==t.id && x.tipo===t.tipo && x.stato==='pubblicato' && fromPrice(x)>0);
  if(!sim.length || !mine) return '';
  const avg = sim.reduce((s,x)=>s+fromPrice(x)/(nights(x.dataInizio,x.dataFine)+1),0)/sim.length;
  const ref = Math.round(avg*days), diff = Math.round((mine-ref)/ref*100);
  return `<div class="notice blue small" style="margin-top:14px">💡 <b>Suggerimento prezzo:</b> sulla piattaforma ${sim.length} tour «${TIPI[t.tipo]}» costano in media ${eur(Math.round(avg))} al giorno a persona. Per ${days} giorni il riferimento è circa <b>${eur(ref)}</b>: la tua quota (${eur(mine)}) è ${diff>=0?'+':''}${diff}% ${Math.abs(diff)<10?'in linea':diff>0?'sopra la media':'sotto la media'}.</div>`;
}

function chatBox(t, u, ruolo){

async function sendChat(tid, ruolo){ const u = me(), txt = val('ch_'+tid); if(!txt) return; const nome = ruolo==='org' ? ((myOrg()||{}).nome||u.nome) : u.nome+' '+(u.cognome||'').slice(0,1)+'.'; await save('messaggi', {id:uid('m'), tourId:tid, userId:u.id, nome, ruolo, testo:txt, createdAt:new Date().toISOString()}); }
function albumBox(t, u){

async function uploadPhoto(tid, input){
  const f = input.files && input.files[0]; if(!f) return;
  try{
    const img = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=r.result; }; r.onerror=rej; r.readAsDataURL(f); });
    const max = 720, sc = Math.min(1, max/Math.max(img.width,img.height)); const c = document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const data = c.toDataURL('image/jpeg', .7);
    if(data.length > 240000){ toast('Foto troppo grande'); return; }
    const u = me(); await save('foto', {id:uid('f'), tourId:tid, userId:u.id, nome:u.nome, img:data, createdAt:new Date().toISOString()}); toast('Foto aggiunta all\'album');
  }catch(e){ toast('Non riesco a leggere questa immagine'); }
}

async function sendSOS(tid){ const t=S.tours[tid], u=me(), txt=val('sos_txt'); if(!txt) return; await save('eventi', {id:uid('e'), tourId:tid, orgId:t.orgId, tipo:'Segnalazione SOS', descrizione:`${u.nome} ${u.cognome||''}: ${txt}`, stato:'aperto', impatto:0, createdAt:new Date().toISOString(), da:'cliente'}); await notify('org:'+t.orgId, `🆘 SOS da ${u.nome} ${u.cognome||''} su «${t.titolo}»: ${txt}`, {tourId:tid}); if(t.accompagnatoreId) await notify('user:'+t.accompagnatoreId, `🆘 SOS da ${u.nome}: ${txt}`, {tourId:tid}); closeModal(); toast('Segnalazione inviata'); }

/* ---- rate, assicurazioni, codici ---- */
function bkTotals(t, b){
  const base = bookingTotal(t, b.camere), pax = b.pax || 1; const ass = b.ass || {};
  const assList = []; let assTot = 0;
  if(ass.annullamento){ const v = Math.round(base*0.06); assList.push({tipo:'Annullamento', importo:v}); assTot += v; }
  if(ass.medica){ const v = 15*pax; assList.push({tipo:'Medico-bagaglio plus', importo:v}); assTot += v; }
  const c = b.codice ? Object.values(S.codici).find(x=>x.codice===b.codice && x.attivo!==false && (!x.orgId || x.orgId===t.orgId)) : null;
  const sconto = c ? Math.min(+c.sconto||0, base) : 0;
  const tot = base + assTot - sconto, acc = Math.round(tot*(settings().accontoPct||30)/100);
  const r1 = Math.ceil(tot/3), dep = d(t.dataInizio), today = new Date(TODAY);
  const last = new Date(Math.max(today.getTime()+7*864e5, dep.getTime()-30*864e5)), mid = new Date((today.getTime()+last.getTime())/2);
  const iso = x => x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
  const rate = [{n:1, data:iso(today), importo:r1, pagata:true}, {n:2, data:iso(mid), importo:r1, pagata:false}, {n:3, data:iso(last), importo:tot-2*r1, pagata:false}];
  return { base, assList, assTot, sconto, codice:c, tot, acc, rate };
}
function extrasBox(t, b){
  const TT = bkTotals(t, b), ass = b.ass || {};
  return `<div class="card pad" style="margin:12px 0;background:#fcfbf8"><b>🛡️ Assicurazioni facoltative</b>
    <label style="display:flex;gap:8px;align-items:center;font-weight:500;margin-top:8px"><input type="checkbox" style="width:auto" ${ass.annullamento?'checked':''} onchange="UI.bk.ass=Object.assign(UI.bk.ass||{},{annullamento:this.checked});bookingStep(3)"> Annullamento per qualsiasi motivo certificabile · ${eur(Math.round(TT.base*0.06))}</label>
    <label style="display:flex;gap:8px;align-items:center;font-weight:500;margin-top:6px"><input type="checkbox" style="width:auto" ${ass.medica?'checked':''} onchange="UI.bk.ass=Object.assign(UI.bk.ass||{},{medica:this.checked});bookingStep(3)"> Spese mediche e bagaglio plus · ${eur(15*(b.pax||1))}</label>
    <div class="row" style="margin-top:12px"><input id="bk_buono" placeholder="Codice buono o promotore (es. AMICI20)" value="${esc(b.codice||'')}" style="max-width:280px"><button class="btn sm" onclick="UI.bk.codice=val('bk_buono').toUpperCase();bookingStep(3)">Applica</button>${b.codice?(TT.codice?`<span class="badge green">−${eur(TT.sconto)}</span>`:'<span class="badge red">codice non valido</span>'):''}</div>
    ${TT.assTot||TT.sconto?`<table style="margin-top:10px"><tr><td>Quote viaggio</td><td class="num">${eur(TT.base)}</td></tr>${TT.assList.map(a=>`<tr><td>Assicurazione ${a.tipo.toLowerCase()}</td><td class="num">${eur(a.importo)}</td></tr>`).join('')}${TT.sconto?`<tr><td>Sconto ${esc(b.codice)}</td><td class="num">−${eur(TT.sconto)}</td></tr>`:''}<tr><td><b>Totale da pagare</b></td><td class="num"><b>${eur(TT.tot)}</b></td></tr></table>`:''}</div>`;

function rateBox(b){

  return `<div class="hotel small"><b>${b.piano==='salvadanaio'?'Salvadanaio viaggio: rate mensili':'Piano a rate senza interessi'}</b><table>${b.rate.map((r,i)=>`<tr><td>Rata ${r.n}</td><td>${fdate(r.data,'y')}</td><td class="num">${eur(r.importo)}</td><td>${r.pagata?'<span class="badge green">pagata</span>':`<button class="btn sm" onclick="payRata('${b.id}',${i})">Paga ora</button>`}</td></tr>`).join('')}</table></div>`;

async function payRata(bid, i){
  const b = clone(S.bookings[bid]); b.rate[i].pagata = true; b.pagato = b.rate.filter(r=>r.pagata).reduce((s,r)=>s+r.importo,0); b.stato = b.pagato>=b.totale?'saldata':'acconto';
  await save('bookings', b); await notify('org:'+b.orgId, `Rata ${b.rate[i].n} pagata da ${(S.users[b.userId]||{}).nome||''} per «${(S.tours[b.tourId]||{}).titolo}» (${eur(b.rate[i].importo)})`, {tourId:b.tourId}); toast('Rata pagata (simulato)');
}
function accIcons(u){ const p = (u||{}).profilo||{}; let s=''; if(p.mobilita && p.mobilita!=='Nessuna') s += ` <span class="badge amber" title="${esc(p.mobilita)}">♿ ${esc(p.mobilita)}</span>`; if(p.cibo && !/^nessun/i.test(p.cibo)) s += ` <span class="badge gray" title="${esc(p.cibo)}">🍽 ${esc(p.cibo)}</span>`; return s; }
function compat(b1, b2){
  const p1 = ((S.users[b1.userId]||{}).profilo)||{}, p2 = ((S.users[b2.userId]||{}).profilo)||{};
  let pts = 0, max = 0; ['ritmo','orari','fumo','russa','budget'].forEach(k=>{ if(p1[k]&&p2[k]){ max++; if(p1[k]===p2[k]) pts++; } });
  const i1 = p1.interessi||[], i2 = p2.interessi||[]; if(i1.length&&i2.length){ max++; pts += i1.filter(x=>i2.includes(x)).length/Math.max(i1.length,i2.length); }
  return max ? Math.round(pts/max*100) : 50;
}

async function sendOffer(pid){
  const pr = +val('of_p_'+pid); if(!pr){ toast('Indica il prezzo'); return; }
  const o = myOrg(), p = clone(S.proposte[pid]); p.offerte = (p.offerte||[]).concat([{orgId:o.id, prezzo:pr, messaggio:val('of_m_'+pid), createdAt:new Date().toISOString()}]);
  await save('proposte', p);
  const dest = p.tipo==='preventivo' ? [p.userId] : (p.interessati||[]);
  for(const u of dest) await notify('user:'+u, `💼 ${o.nome} ha fatto un'offerta per «${p.gruppoNome||p.destinazione}»: ${eur(pr)} a persona.`, {propostaId:pid});

}
function tourFromProposta(pid){
  const p = S.proposte[pid], t = blankTour();
  Object.assign(t, { titolo:p.destinazione, tipo:TIPO_CFG[p.tipologia]?p.tipologia:'pullman_hotel', propostaId:pid, descrizione:p.note||'' });
  if(p.tipo==='preventivo'){ Object.assign(t, { privato:true, gruppoTipo:p.gruppoTipo, gruppoNome:p.gruppoNome, referenteUserId:p.userId, codice:newCode(), minPartecipanti:Math.max(1,Math.round((p.persone||20)*0.8)) }); t.pubblico = ({scuola:['scuole'], azienda:['aziende'], associazione:['associazioni'], parrocchia:['associazioni']})[p.gruppoTipo]||[]; t.mezzo.posti = Math.max(20,(p.persone||0)+2); }
  if(p.partenza) t.punti = [{luogo:p.partenza, orario:''}];
  const off = p.offertaAccettata!=null ? p.offerte[p.offertaAccettata] : null; if(off) t.descrizione = (t.descrizione?t.descrizione+'\n':'')+'Offerta accettata: '+eur(off.prezzo)+' a persona. '+(off.messaggio||'');
  UI.draft = t; UI.etab='generale'; UI.sub='editor'; UI.editing=true; renderAll(); window.scrollTo(0,0); toast('Bozza creata dalla richiesta: completa e pubblica');
}

/* ============ CRM: imprevisti, contabilità, fornitori, rete ============ */
const IMPREVISTI = ['Ritardo','Cambio fornitore','Overbooking hotel','Partecipante interrompe il viaggio','No-show','Servizio non erogato','Problema bagaglio','Malore / sanitario','Segnalazione SOS','Altro'];
function crmImprevisti(o){
  const p = tourPicker(o,'it'), t = S.tours[p.cur]; if(!t) return '<h2>Imprevisti</h2><div class="empty">Nessun tour.</div>';

async function saveEvento(tid){
  const t = S.tours[tid]; if(!val('ev_desc')){ toast('Descrivi cosa è successo'); return; }
  const e = await save('eventi', {id:uid('e'), tourId:tid, orgId:t.orgId, tipo:val('ev_tipo'), descrizione:val('ev_desc'), azione:val('ev_az'), impatto:+val('ev_imp')||0, stato:checked('ev_conf')?'attesa':'aperto', createdAt:new Date().toISOString(), da:(me()||{}).nome});
  if(checked('ev_avv')) for(const u of new Set(activeBookings(t).map(b=>b.userId))) await notify('user:'+u, `ℹ️ Variazione su «${t.titolo}»: ${e.tipo}. ${e.azione||e.descrizione}${e.stato==='attesa'?' — ti chiediamo di confermare rispondendo all\'organizzatore.':''}`, {tourId:tid});
  toast('Imprevisto registrato');
}
async function resolveEv(id){ await save('eventi', Object.assign({}, S.eventi[id], {stato:'risolto'})); }
function crmConti(o){

  const occ = occupied(t), cap = capacity(t)||1, c = costiNetti(t);
  const prevCost = c.mezzo + c.extra + (c.camere + c.quota) * occ / cap;
  const reali = t.costiReali||[], realTot = reali.reduce((s,x)=>s+(+x.importo||0),0);
  const commOvigo = vend*comm/100, commRete = bks.filter(b=>b.rivenditoreOrgId).reduce((s,b)=>s+b.totale*(b.commRivendita!=null&&b.commRivendita!==''?+b.commRivendita:(+t.commRivendita||0))/100,0), commProm = bks.filter(b=>b.buono).reduce((s,b)=>{ const cc = Object.values(S.codici).find(x=>x.codice===b.buono); return s+(cc&&cc.commissione?b.totale*cc.commissione/100:0); },0);

  const chiuso = daysTo(t.dataFine)<0 && reali.length; const costUsed = chiuso ? realTot : Math.max(realTot, prevCost);

    ${row('Costi fornitori', prevCost, realTot)}${row('Commissione OVIGO '+comm+'%', commOvigo, commOvigo)}${row('Commissioni agenzie rete', commRete, commRete)}${row('Commissioni promotori', commProm, commProm)}${row('Imprevisti', 0, imp)}
    <tr><td><b>Margine</b></td><td class="num"><b>${eur(margPrev)}</b></td><td class="num"><b>${eur(margReal)}</b></td></tr></table>
    <p class="tiny muted">Preventivo calcolato sugli iscritti attuali: camere e quote proporzionali, trasporto ed extra per intero. Assicurazioni vendute: ${eur(ass)} (girate alla compagnia).</p></div>

    <h3 style="margin-top:16px">Scadenze fornitori</h3>${(t.pagamentiFornitori||[]).map((x,i)=>`<div class="row between small" style="padding:4px 0"><span>${esc(x.fornitore)} · ${fdate(x.data,'y')} · <b>${eur(x.importo)}</b></span>${x.pagato?'<span class="badge green">pagato</span>':`<button class="btn sm" onclick="paySupplier('${t.id}',${i})">Segna pagato</button>`}</div>`).join('')||'<p class="small muted">Nessuna scadenza.</p>'}</div></div>`;

async function addCosto(tid){ const v=val('cr_v'), i=+val('cr_i'); if(!v||!i){ toast('Voce e importo'); return; } const t=clone(S.tours[tid]); t.costiReali=(t.costiReali||[]).concat([{voce:v, fornitore:val('cr_f'), importo:i}]); await save('tours', t); }
async function delCosto(tid, i){ const t=clone(S.tours[tid]); t.costiReali.splice(i,1); await save('tours', t); }
async function paySupplier(tid, i){ const t=clone(S.tours[tid]); t.pagamentiFornitori[i].pagato=true; t.costiReali=(t.costiReali||[]).concat([{voce:'Pagamento '+t.pagamentiFornitori[i].fornitore, fornitore:t.pagamentiFornitori[i].fornitore, importo:t.pagamentiFornitori[i].importo}]); await save('tours', t); toast('Pagamento registrato tra i costi reali'); }

function can(p){ const u = me(); return !u || !u.permessi || !!u.permessi[p]; }

/* ---- prezzi per posizione nel letto ---- */
function baseNetto(c, tipo){ return c.intera ? (+c.intera)/CAMERE[tipo].p : (+c.netto||0); }
function markupEff(c, tipo){ const b = baseNetto(c, tipo); return c.lordo && b ? ((+c.lordo)/b - 1)*100 : (+c.markup||0); }
function nettoPos(c, tipo, pos, child){
  let n = baseNetto(c, tipo), special = false;
  if((tipo==='doppia' || (CAMERE[tipo]||{}).occ==='doppia') && pos===1 && c.netto2) n = +c.netto2;
  if(pos===2){ if(child && c.netto3b!=null && c.netto3b!==''){ n = +c.netto3b; special = true; } else if(!child && c.netto3a) n = +c.netto3a; }
  if(pos===3){ if(child && c.netto4b!=null && c.netto4b!==''){ n = +c.netto4b; special = true; } else if(!child && c.netto4a) n = +c.netto4a; }
  return { n, special };
}
function notti(t){ return Math.max(1, nights(t.dataInizio, t.dataFine)); }
function svN(t, s){ return (+s.netto||0) * (s.alGiorno ? notti(t) : 1); }
function serviziPP(t, soloObblig){
  return (t.servizi||[]).filter(s=>s.obbligatorio).reduce((s,x)=>s + (x.perPersona ? vend(svN(t,x), x.markup) : vend(svN(t,x)/(capacity(t)||1), x.markup)), 0);
}
function roomPP(t, tipo, pos){ const c = (t.camere||{})[tipo]; if(!c) return 0; return vend(nettoPos(c, tipo, pos||0, false).n, markupEff(c, tipo)); }
function personPrice(t, tipo, eta, pos, mezziPropri){
  const child = eta!=='' && eta!=null && +eta < 12; const sc = +t.scontoBambino||0; let base;
  if(!hasRooms(t)){ base = vend((t.quota||{}).netto, (t.quota||{}).markup) + (hasBus(t)?busPP(t):0); if(child) base = Math.round(base*(1-sc/100)); }
  else {
    const c = (t.camere||{})[tipo] || {}; const r = nettoPos(c, tipo, pos||0, child);
    base = vend(r.n, markupEff(c, tipo));
    if(child && !r.special && (tipo==='tripla'||tipo==='quadrupla')) base = Math.round(base*(1-sc/100));
    if(!mezziPropri) base += busPP(t);
  }
  return Math.round(base + serviziPP(t, true));
}
function bookingTotal(t, camere){
  let tot = 0;
  (camere||[]).forEach(r => (r.occ||[]).forEach((p,i) => { tot += personPrice(t, r.condivisa ? 'doppia' : (r.tipo==='posto'?null:r.tipo), p.eta, r.condivisa?0:i, r.mezziPropri); }));
  return tot;
}
function costiNetti(t){
  const out = { camere:0, mezzo:+((t.mezzo||{}).netto)||0, extra:(t.extra||[]).reduce((s,e)=>s+(+e.netto||0),0), quota:0, servizi:0 };
  if(!hasRooms(t)) out.quota = (+((t.quota||{}).netto)||0) * capacity(t);
  else Object.keys(CAMERE).forEach(k=>{ const c=(t.camere||{})[k]; if(c&&c.n) out.camere += (+c.n)*baseNetto(c,k)*CAMERE[k].p; });
  (t.servizi||[]).filter(s=>s.obbligatorio).forEach(s=>{ out.servizi += s.perPersona ? svN(t,s)*capacity(t) : svN(t,s); });
  out.tot = out.camere+out.mezzo+out.extra+out.quota+out.servizi; return out;
}
function opzioniFacoltative(t){
  const ex = (t.extra||[]).filter(e=>+e.vendita>0).map((e,i)=>({id:'e'+i, nome:e.nome, prezzo:+e.vendita}));
  const sv = (t.servizi||[]).filter(s=>!s.obbligatorio).map((s,i)=>({id:'s'+i, nome:s.tipo+': '+(s.descrizione||''), prezzo:(+s.vendita ? +s.vendita*(s.alGiorno?notti(t):1) : 0) || (s.perPersona?vend(svN(t,s),s.markup):vend(svN(t,s)/(capacity(t)||1),s.markup))}));
  return ex.concat(sv.filter(x=>x.prezzo>0));
}
function bkTotals(t, b){
  const base = bookingTotal(t, b.camere), pax = b.pax || 1; const ass = b.ass || {};
  const assList = []; let assTot = 0;
  if(ass.annullamento){ const v = Math.round(base*0.06); assList.push({tipo:'Annullamento', importo:v}); assTot += v; }
  if(ass.medica){ const v = 15*pax; assList.push({tipo:'Medico-bagaglio plus', importo:v}); assTot += v; }
  const tratt = t.trattamentoScelta && b.trattamento==='Pensione completa' ? (+t.supplementoPC||0)*pax : 0;
  const ops = opzioniFacoltative(t), extraScelti = ops.filter(o=>(b.extra||{})[o.id]).map(o=>({nome:o.nome, prezzo:o.prezzo, qty:pax, totale:o.prezzo*pax}));
  const extraTot = extraScelti.reduce((s,x)=>s+x.totale,0);
  const c = b.codice ? Object.values(S.codici).find(x=>x.codice===b.codice && x.attivo!==false && (!x.orgId || x.orgId===t.orgId) && !(x.monouso && x.usato) && !(x.scadenza && x.scadenza < new Date(TODAY).toISOString().slice(0,10))) : null;
  const sconto = c ? Math.min(+c.sconto||0, base) : 0;
  const suppl = (+t.supplementoExtra||0)*pax;
  const sgr = scontoGruppo(t, pax), sgrPP = pax ? sgr/pax : 0;
  const tot = Math.max(0, base + assTot + tratt + extraTot + suppl - sconto - sgr), acc = Math.round(tot*(settings().accontoPct||30)/100);
  const r1 = Math.ceil(tot/3), dep = d(t.dataInizio), today = new Date(TODAY);
  const last = new Date(Math.max(today.getTime()+7*864e5, dep.getTime()-30*864e5)), mid = new Date((today.getTime()+last.getTime())/2);
  const iso = x => x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
  const rate = [{n:1, data:iso(today), importo:r1, pagata:true}, {n:2, data:iso(mid), importo:r1, pagata:false}, {n:3, data:iso(last), importo:tot-2*r1, pagata:false}];
  return { base, assList, assTot, tratt, extraScelti, extraTot, suppl, sconto, sgr, sgrPP, codice:c, tot, acc, rate };
}
