/* ---- manutenzione automatica (scadenze, promemoria, invii) ---- */
UI.maint = {};
async function maintTick(){
  const u = me(); if(!u || !loaded.tours || !loaded.bookings || UI.maint[u.id] || UI.editing) return;
  UI.maint[u.id] = true;
  try{
    if(u.ruolo==='cliente'){
      for(const b of Object.values(S.bookings).filter(b=>b.userId===u.id && (b.tipo==='richiesta'||b.tipo==='attesa') && b.stato==='in_attesa' && b.scadenza && daysTo(b.scadenza)<0)){
        const t = S.tours[b.tourId]; if(!t) continue;
        await save('bookings', Object.assign({}, b, {stato:'scaduta'}));
        if(!Object.values(S.bookings).some(x=>x.userId===u.id&&x.tourId===b.tourId&&x.tipo==='desiderio')) await save('bookings', {id:uid('b'), tourId:b.tourId, orgId:b.orgId, userId:u.id, tipo:'desiderio', stato:'attivo', pax:0, createdAt:new Date().toISOString()});
        await notify('user:'+u.id, `La tua ${b.tipo==='attesa'?'lista d\'attesa':'richiesta'} per «${t.titolo}» è scaduta: il tour è ora nella tua lista dei desideri.`, {tourId:t.id});
      }
      for(const z of Object.values(S.bozze).filter(z=>z.userId===u.id && (z.promemoria||0)<3)){
        const last = z.ultimoPromemoria ? new Date(z.ultimoPromemoria) : new Date(z.createdAt);
        if(Date.now()-last > 60*1000 && S.tours[z.tourId]){
          await notify('user:'+u.id, `⏳ Hai lasciato a metà la prenotazione di «${S.tours[z.tourId].titolo}». I posti si stanno riempiendo: completala da «Da completare».`, {tourId:z.tourId, canale:'push + email'});
          await save('bozze', Object.assign({}, z, {promemoria:(z.promemoria||0)+1, ultimoPromemoria:new Date().toISOString()}));
        }
      }
    }
    if(u.ruolo==='organizzatore'){
      const o = myOrg(); if(!o) return;
      for(const t of orgTours(o.id).filter(t=>t.stato==='pubblicato' && t.contratto==='allotment' && t.release)){
        const g = daysTo(t.release), sent = t.releaseAvvisi||[];
        const soglia = [14,7,3,1].find(s=>g<=s && g>=0 && !sent.includes(s));
        if(soglia){ await notify('org:'+o.id, `🏨 Release camere di «${t.titolo}» tra ${g} giorni (${fdate(t.release,'y')}): conferma o rilascia le camere non vendute.`, {tourId:t.id, canale:'email'}); await save('tours', Object.assign({}, t, {releaseAvvisi:sent.concat([soglia])})); }
      }
      const miss = ['piva','pec','licenza','polizza'].filter(k=>!o[k]);
      if(miss.length && (!o.ultimoPromemoriaAnagrafica || Date.now()-new Date(o.ultimoPromemoriaAnagrafica) > 7*864e5)){ await notify('org:'+o.id, `📋 Promemoria settimanale: completa l'anagrafica (${miss.join(', ')}).`, {canale:'email'}); await save('orgs', Object.assign({}, o, {ultimoPromemoriaAnagrafica:new Date().toISOString()})); }
      for(const p of Object.values(S.programmati).filter(p=>p.orgId===o.id && p.stato==='programmato' && new Date(p.quando)<=new Date())) await sendProgrammato(p);
      for(const b of Object.values(S.bookings).filter(b=>b.orgId===o.id && b.tipo==='prenotazione' && b.stato==='bloccata' && b.scadenzaOpzione && daysTo(b.scadenzaOpzione)<0)){
        await save('bookings', Object.assign({}, b, {stato:'annullata', motivo:'Opzione scaduta'}));
        await notify('user:'+b.userId, `L'opzione su «${(S.tours[b.tourId]||{}).titolo}» è scaduta e i posti sono stati liberati.`, {tourId:b.tourId});
      }
    }
  }catch(e){ console.warn('maint', e); }
}
setInterval(maintTick, 4000);

/* ---- invii programmati ---- */
async function sendProgrammato(p){
  const t = S.tours[p.tourId]; if(!t) return;
  if(p.tipo==='convocazione') await save('tours', Object.assign({}, t, {convocazione:{testo:p.testo, inviata:new Date().toISOString(), canali:'app, email, WhatsApp'}}));
  for(const u of new Set(activeBookings(t).map(b=>b.userId))) await notify('user:'+u, (p.tipo==='convocazione'?'📣 Convocazione per «':'💬 Messaggio per «')+t.titolo+'»: '+p.testo, {tourId:t.id, canale:'programmato'});
  await save('programmati', Object.assign({}, p, {stato:'inviato', inviatoIl:new Date().toISOString()}));
}
async function sendConvocazione(tid){
  const t = S.tours[tid], testo = val('cv_txt'), when = val('cv_when'); if(!testo){ toast('Scrivi il testo'); return; }
  if(when && new Date(when) > new Date()){ await save('programmati', {id:uid('q'), orgId:t.orgId, tourId:tid, tipo:'convocazione', testo, quando:new Date(when).toISOString(), stato:'programmato', createdAt:new Date().toISOString()}); toast('Convocazione programmata'); return; }
  const canali = ['app', checked('cv_mail')?'email':'', checked('cv_wa')?'WhatsApp':''].filter(Boolean).join(', ');
  await save('tours', Object.assign({}, t, {convocazione:{testo, inviata:new Date().toISOString(), canali}}));
  for(const u of new Set(activeBookings(t).map(b=>b.userId))) await notify('user:'+u, `📣 Convocazione per «${t.titolo}»: ${testo}`, {tourId:tid, canale:canali});
  toast('Convocazione inviata');
}
async function sendGroupMsg(tid){
  const t = S.tours[tid], m = val('gm_txt'), when = val('gm_when'); if(!m) return;
  if(when && new Date(when) > new Date()){ await save('programmati', {id:uid('q'), orgId:t.orgId, tourId:tid, tipo:'messaggio', testo:m, quando:new Date(when).toISOString(), stato:'programmato', createdAt:new Date().toISOString()}); toast('Messaggio programmato'); return; }
  for(const u of new Set(activeBookings(t).map(b=>b.userId))) await notify('user:'+u, `💬 ${(S.orgs[t.orgId]||{}).nome} per «${t.titolo}»: ${m}`, {tourId:tid}); toast('Messaggio inviato');
}
const MODELLI_DEF = { accettata:'Ciao {nome}, buone notizie: per «{tour}» c\'è disponibilità! Prenota dalla tua area entro 3 giorni.', rifiutata:'Ciao {nome}, purtroppo per «{tour}» non c\'è più disponibilità. Ti avviseremo alla prossima partenza.', liberato:'Ciao {nome}, si è liberato un posto su «{tour}» ({data}): prenota subito dalla tua area.', chiusa:'Ciao {nome}, la lista d\'attesa per «{tour}» è chiusa. Il tour resta nella tua lista dei desideri.' };
function modello(o, k, ctx){ const m = ((o||{}).modelli||{})[k] || MODELLI_DEF[k]; return m.replace(/\{nome\}/g, ctx.nome||'').replace(/\{tour\}/g, ctx.tour||'').replace(/\{data\}/g, ctx.data||''); }
async function answerReq(id, yes){
  const b = S.bookings[id], t = S.tours[b.tourId], msg = val('rp_'+id), o = S.orgs[b.orgId], u = S.users[b.userId]||{};
  const stato = b.tipo==='attesa' ? (yes?'posto_liberato':'chiusa') : (yes?'accettata':'rifiutata');
  const key = b.tipo==='attesa' ? (yes?'liberato':'chiusa') : (yes?'accettata':'rifiutata');
  const txt = modello(o, key, {nome:u.nome, tour:t.titolo, data:frange(t.dataInizio,t.dataFine)}) + (msg?' '+msg:'');
  await save('bookings', Object.assign({}, b, {stato, risposta:txt, rispostaIl:new Date().toISOString()}));
  await notify('user:'+b.userId, txt, {tourId:t.id, bookingId:id, canale:'email + app'});
  if(!yes && !Object.values(S.bookings).some(x=>x.userId===b.userId&&x.tourId===b.tourId&&x.tipo==='desiderio')) await save('bookings',{id:uid('b'),tourId:b.tourId,orgId:b.orgId,userId:b.userId,tipo:'desiderio',stato:'attivo',pax:0,createdAt:new Date().toISOString()});
  toast('Risposta inviata con il modello');
}

async function sendDM(from, to, testo, nome){ if(!testo || !to) return; await save('dm', {id:uid('d'), from, to, testo, fromNome:nome||'', createdAt:new Date().toISOString()}); const el=document.getElementById('pm_txt')||document.getElementById('dm_txt'); if(el) el.value=''; toast('Messaggio inviato'); if(to.startsWith('user:')) await notify(to, `✉️ Nuovo messaggio privato da ${nome||''}`); }

/* ---- documenti con stati e scadenze ---- */
function docState(t, f){ if(!f) return 'manca'; if(f.stato==='rifiutato') return 'rifiutato'; if(f.scadenza && f.scadenza < t.dataFine) return 'scaduto'; if(f.scadenza && daysTo(f.scadenza) - daysTo(t.dataFine) < 180 && (f.tipo||'').toLowerCase().includes('passaporto')) return 'in_scadenza'; return f.stato==='ok' ? 'ok' : 'da_verificare'; }
const DOC_LBL = { manca:['Mancante','red'], da_verificare:['Da verificare','amber'], ok:['Verificato','green'], rifiutato:['Rifiutato','red'], scaduto:['Scade prima del rientro','red'], in_scadenza:['In scadenza','amber'] };
function missingDocs(b){ const t=S.tours[b.tourId]; if(!t||!(t.documenti||[]).length||b.tipo!=='prenotazione'||b.stato==='annullata'||daysTo(t.dataFine)<0) return 0; let m=0; (b.partecipanti||[]).forEach((p,i)=>(t.documenti||[]).forEach(dn=>{ const s = docState(t,(b.documenti||{})[i+'|'+dn]); if(s==='manca'||s==='rifiutato'||s==='scaduto') m++; })); return m; }
function docsCard(b){
  const t = S.tours[b.tourId], req = t.documenti||[];
  if(!req.length) return `<div class="card pad" style="margin-bottom:10px"><b>${esc(t.titolo)}</b><div class="small muted">Nessun documento richiesto.</div></div>`;
  return `<div class="card pad" style="margin-bottom:12px"><div class="row between"><b>${esc(t.titolo)}</b>${missingDocs(b)?`<span class="badge red">${missingDocs(b)} da sistemare</span>`:'<span class="badge green">In regola</span>'}</div>
  <table style="margin-top:8px">${(b.partecipanti||[]).map((p,i)=>req.map(dn=>{ const k=i+'|'+dn, f=(b.documenti||{})[k], st=docState(t,f), L=DOC_LBL[st]; return `<tr><td>${esc(p.nome)}</td><td>${esc(dn)}</td><td><span class="badge ${L[1]}">${L[0]}</span> ${f?`<span class="tiny muted">${esc(f.nome)}${f.scadenza?' · scade '+fdate(f.scadenza,'y'):''}${fileLink(f)}</span>`:''}</td><td>${st!=='ok'?`<div class="row" style="gap:4px"><span class="tiny muted">scade il</span><input type="date" id="ds_${b.id}_${i}_${dn.replace(/\W/g,'')}" title="Scadenza del documento" style="width:140px;padding:5px"><label class="btn sm" style="margin:0">${f?'Sostituisci':'Carica'}<input type="file" style="display:none" onchange="uploadDoc('${b.id}','${k.replace(/'/g,"\\'")}',this,'ds_${b.id}_${i}_${dn.replace(/\W/g,'')}')"></label></div>`:''}</td></tr>`; }).join('')).join('')}</table>

      const max=900, sc=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height);

/* ---- partenze imminenti per livello di rischio ---- */
function rischio(t){
  const occ = occupied(t), min = +t.minPartecipanti||0, g = daysTo(t.dataInizio);
  const md = activeBookings(t).reduce((s,b)=>s+missingDocs(b),0), saldi = activeBookings(t).reduce((s,b)=>s+Math.max(0,(b.totale||0)-(b.pagato||0)),0);
  const forn = (t.pagamentiFornitori||[]).filter(p=>!p.pagato && daysTo(p.data)<=14).length;
  const ev = Object.values(S.eventi).filter(e=>e.tourId===t.id && e.stato!=='risolto').length;
  let score = 0; const why = [];
  if(occ<min){ score += g<=30?3:1; why.push(`${min-occ} al minimo`); }
  if(md && g<=30){ score += 2; why.push(md+' documenti'); }
  if(saldi && g<=21){ score += 1; why.push(eur(saldi)+' da incassare'); }
  if(forn){ score += 1; why.push(forn+' pagamenti fornitori'); }
  if(t.contratto==='allotment' && t.release && daysTo(t.release)>=0 && daysTo(t.release)<=7){ score += 1; why.push('release vicina'); }
  if(ev){ score += 2; why.push(ev+' imprevisti aperti'); }
  return { livello: score>=4?'alto':score>=2?'medio':'basso', why, md, saldi };
}

  const col = {alto:'red', medio:'amber', basso:'green'};

  <div class="card" style="overflow-x:auto"><table><tr><th>Tour</th><th>Partenza</th><th>Iscritti</th><th>Rischio</th><th>Motivi</th><th></th></tr>${rows.map(({t,r})=>`<tr><td><b>${esc(t.titolo)}</b><div class="tiny muted">${cfg(t).i} ${TIPI[t.tipo]}</div></td><td class="small">${fdate(t.dataInizio,'y')}<div class="tiny muted">tra ${daysTo(t.dataInizio)} gg</div></td><td style="min-width:120px"><div class="small">${occupied(t)}/${capacity(t)} · min ${t.minPartecipanti}</div><div class="fill ${confirmed(t)?'ok':''}"><i style="width:${capacity(t)?occupied(t)/capacity(t)*100:0}%"></i></div></td><td><span class="badge ${col[r.livello]}">${r.livello}</span></td><td class="small">${r.why.join(' · ')||'—'}</td><td><button class="btn sm" onclick="editTour('${t.id}')">Apri</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted small">Nessuna partenza in questa vista.</td></tr>'}</table></div>`;

/* ---- rooming list per hotel: editor con trascinamento ---- */
function roomingFromBookings(t){
  const rooms = [];
  activeBookings(t).forEach(b=>(b.camere||[]).forEach(r=>{
    if(r.condivisa && r.abbinataCon && b.id > r.abbinataCon) return;
    const occ = r.occ.map(o=>({nome:o.nome, eta:o.eta||'', bid:b.id}));
    if(r.condivisa && r.abbinataCon){ const ob = S.bookings[r.abbinataCon]; ((ob||{}).camere||[]).filter(x=>x.abbinataCon===b.id).forEach(x=>x.occ.forEach(o=>occ.push({nome:o.nome, eta:o.eta||'', bid:ob.id}))); }
    else if(r.condivisa) occ.push({nome:'', vuoto:true});
    rooms.push({id:uid('r'), tipo:r.tipo, occ, mezziPropri:!!r.mezziPropri, note:''});
  }));
  return rooms;
}

function rmDrag(e, ri, oi){ e.dataTransfer.setData('text/plain', JSON.stringify({ri, oi})); }
function rmDragNew(e, bid, nome, eta){ e.dataTransfer.setData('text/plain', JSON.stringify({nuovo:{bid, nome, eta}})); }
function rmDrop(e, to){
  e.preventDefault(); let d; try{ d = JSON.parse(e.dataTransfer.getData('text/plain')); }catch(x){ return; }
  const R = UI.rme.rooms; let p;
  if(d.nuovo) p = d.nuovo; else { p = R[d.ri].occ.splice(d.oi,1)[0]; if(!p) return; }
  if(to>=0){ const r = R[to]; const free = r.occ.findIndex(x=>x.vuoto); if(free>=0) r.occ[free] = p; else r.occ.push(p); }
  renderAll();
}
function t_resetRooming(tid, hi){ const t=S.tours[tid]; UI.rme = { key:tid+'|'+hi, rooms: roomingFromBookings(t) }; renderAll(); }
function importRooming(input){
  const f = input.files && input.files[0]; if(!f) return;
  const r = new FileReader(); r.onload = () => {
    const lines = String(r.result).split(/\r?\n/).map(l=>l.trim()).filter(Boolean); const out = [];
    const tmap = { singola:'singola', doppia:'doppia', matrimoniale:'doppia', tripla:'tripla', quadrupla:'quadrupla', dus:'singola' };
    lines.forEach((l,i)=>{ const c = l.split(/[;\t]/); if(i===0 && /camera/i.test(c[0])) return; const tipo = tmap[(c[1]||'').toLowerCase().split(' ')[0]] || 'doppia'; const names = (c[2]||c[1]||'').split(',').map(x=>x.trim()).filter(Boolean); out.push({id:uid('r'), tipo, occ:names.map(n=>({nome:n, eta:''})), note:c[3]||''}); });
    if(!out.length){ toast('File vuoto o non leggibile'); return; }
    UI.rme.rooms = out; toast(out.length+' camere importate'); renderAll();
  }; r.readAsText(f);
}
async function saveRooming(tid, hi, invia){
  const t = clone(S.tours[tid]); t.rooming = t.rooming || {};
  t.rooming[hi] = { rooms: clone(UI.rme.rooms), salvata:new Date().toISOString(), inviata: invia ? new Date().toISOString() : ((t.rooming[hi]||{}).inviata||'') };
  await save('tours', t);
  if(invia){
    const bids = new Set(UI.rme.rooms.flatMap(r=>r.occ.map(x=>x.bid).filter(Boolean)));
    for(const bid of bids){ const b = S.bookings[bid]; if(!b) continue; await save('bookings', Object.assign({}, b, {cameraOk:false})); await notify('user:'+b.userId, `🛏️ La sistemazione in camera per «${t.titolo}» è pronta: controllala e conferma dalla tua area.`, {tourId:tid, bookingId:bid}); }
  }
  toast(invia?'Rooming salvata e inviata ai clienti':'Rooming salvata');
}
function cameraBox(b){

  const mine = []; Object.entries(t.rooming).forEach(([hi,rm])=>{ if(!rm.inviata) return; (rm.rooms||[]).forEach((r,i)=>{ if(r.occ.some(x=>x.bid===b.id)) mine.push({h:(t.hotel||[])[+hi]||{}, r, i}); }); });
  if(!mine.length) return '';
  return `<div class="hotel small" style="margin-top:8px">🛏️ <b>La tua camera</b>: ${mine.map(m=>`${esc(m.h.nome||'')} · ${CAMERE[m.r.tipo]?.l||m.r.tipo} #${m.i+1} con ${m.r.occ.filter(x=>!x.vuoto).map(x=>esc(x.nome)).join(', ')}`).join('<br>')}
  ${b.cameraOk===false?`<div class="row" style="margin-top:6px"><button class="btn pri sm" onclick="okCamera('${b.id}',true)">Confermo la sistemazione</button><button class="btn sm ghost" onclick="okCamera('${b.id}',false)">Chiedo una modifica</button></div>`:b.cameraOk?' <span class="badge green">confermata</span>':b.cameraModifica?' <span class="badge amber">modifica richiesta</span>':''}</div>`;

async function okCamera(bid, ok){

  await save('bookings', Object.assign({}, b, ok?{cameraOk:true, cameraModifica:''}:{cameraOk:null, cameraModifica:msg||'richiesta'}));

}

function collabOk(a, b){ return !!collabOf(a, b); }
function commFor(orgId, t){ const c = collabOf(orgId, t.orgId); return c ? (+c.commissione||0) : (+t.commRivendita||0); }

async function sendCampaign(){
  const seg = val('mk_s'), tid = val('mk_t'), m = val('mk_m'); if(!m) return;
  let us = Object.values(S.users).filter(u=>u.ruolo==='cliente');
  const pb = u => Object.values(S.bookings).filter(b=>b.userId===u.id);
  if(seg==='desideri') us = us.filter(u=>pb(u).some(b=>b.tipo==='desiderio'));
  if(seg==='viaggiato') us = us.filter(u=>pb(u).some(b=>b.tipo==='prenotazione'&&b.stato!=='annullata'&&daysTo((S.tours[b.tourId]||{}).dataFine)<0));
  if(seg==='mai') us = us.filter(u=>!pb(u).some(b=>b.tipo==='prenotazione'));
  for(const u of us) await notify('user:'+u.id, '📢 '+m, tid?{tourId:tid, canale:'email + push'}:{canale:'email + push'});
  toast(`Campagna inviata a ${us.length} clienti`);
}
async function sendBroadcast(){
  const to = val('bc_to'), m = val('bc_m'); if(!m) return; let n = 0;
  if(to!=='cli') for(const o of Object.values(S.orgs)){ await notify('org:'+o.id, '📢 OVIGO: '+m); n++; }
  if(to!=='org') for(const u of Object.values(S.users).filter(u=>u.ruolo==='cliente')){ await notify('user:'+u.id, '📢 OVIGO: '+m); n++; }
  toast('Inviato a '+n+' destinatari');
}

/* ---------- chi c'è nel gruppo ---------- */
function chiCe(t){
  const bks = activeBookings(t); if(occupied(t) < 3) return `<div class="card pad" style="margin-top:12px"><b>Chi c'è nel gruppo</b><p class="small muted" style="margin:6px 0 0">Il gruppo si sta formando: la composizione si vede dai 3 iscritti in su.</p></div>`;
  const fasce = {}, sesso = {Donna:0, Uomo:0}, citta = {}; let soli=0, coppie=0, famiglie=0, amici=0, minori=0, nd=0;
  bks.forEach(b=>{
    const u = S.users[b.userId]||{}, p = u.profilo||{}, parts = b.partecipanti||[];
    const kids = parts.filter(x=>x.eta!==''&&x.eta!=null&&+x.eta<18).length; minori += kids;
    if(b.pax===1) soli++; else if(kids) famiglie++; else if(b.pax===2) coppie++; else amici++;
    const adults = parts.length - kids;
    for(let i=0;i<adults;i++){ if(i===0 && p.fascia) fasce[p.fascia]=(fasce[p.fascia]||0)+1; else if(i===0) nd++; }
    if(p.sesso==='Donna'||p.sesso==='Uomo') sesso[p.sesso]++;
    if(u.citta) citta[u.citta]=(citta[u.citta]||0)+1;
  });
  const maxF = Math.max(1, ...Object.values(fasce));
  const topC = Object.entries(citta).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const tot = bks.length, sx = sesso.Donna+sesso.Uomo;
  return `<div class="card pad" style="margin-top:12px"><b>Chi c'è nel gruppo</b><div class="tiny muted">In forma anonima, da ${tot} prenotazioni</div>
  <div class="row small" style="gap:14px;margin:10px 0">${soli?`<span><b>${soli}</b> da soli</span>`:''}${coppie?`<span><b>${coppie}</b> coppie</span>`:''}${famiglie?`<span><b>${famiglie}</b> famiglie</span>`:''}${amici?`<span><b>${amici}</b> gruppi di amici</span>`:''}${minori?`<span><b>${minori}</b> minori</span>`:''}</div>
  ${Object.keys(fasce).length?`<div class="small" style="margin-bottom:6px">Età di chi ha prenotato</div>${FASCE.filter(f=>fasce[f]).map(f=>`<div class="row small" style="gap:8px;margin-bottom:4px"><span style="width:62px">${f}</span><div class="fill" style="flex:1"><i style="width:${fasce[f]/maxF*100}%"></i></div><span style="width:18px;text-align:right">${fasce[f]}</span></div>`).join('')}${nd?`<div class="tiny muted">${nd} non hanno indicato l'età</div>`:''}`:''}
  ${sx?`<div class="small" style="margin-top:8px">${Math.round(sesso.Donna/sx*100)}% donne · ${Math.round(sesso.Uomo/sx*100)}% uomini <span class="tiny muted">(su chi l'ha indicato)</span></div>`:''}
  ${topC.length?`<div class="small" style="margin-top:4px">Arrivano soprattutto da ${topC.map(c=>esc(c[0])).join(', ')}</div>`:''}</div>`;
}

/* ---------- più siamo, meno paghi ---------- */
function scaglioniOf(t){ return (t.scaglioni||[]).filter(s=>+s.da>0 && +s.sconto>0).sort((a,b)=>a.da-b.da); }
function scontoLivello(t, n){ let sc = 0; scaglioniOf(t).forEach(s=>{ if(n >= +s.da) sc = +s.sconto; }); return sc; }
function scontoGruppo(t, pax){ return scontoLivello(t, occupied(t) + (pax||0)) * (pax||0); }
function scaglioniBox(t){
  const sc = scaglioniOf(t); if(!sc.length) return '';
  const n = occupied(t), cur = scontoLivello(t, n), next = sc.find(s=>n < +s.da);
  return `<div class="card pad" style="margin-top:12px"><b>Più siamo, meno paghi</b>
  <div class="small muted" style="margin:4px 0 10px">Lo sconto vale per tutti, anche per chi ha già prenotato.</div>
  ${sc.map(s=>`<div class="row between small" style="padding:5px 0;${n>=+s.da?'font-weight:700;color:var(--green)':''}"><span>${n>=+s.da?'✓ ':''}da ${s.da} iscritti</span><span>−${eur(s.sconto)} a persona</span></div>`).join('')}
  <div class="notice ${next?'blue':'green'} small" style="margin-top:8px">${next?`Siete in ${n}: con altri <b>${next.da-n}</b> iscritti tutti risparmiano ${eur(next.sconto)} a persona${cur?` (oggi già −${eur(cur)})`:''}. <a style="cursor:pointer" onclick="openShare('${t.id}')">Invita un amico</a>`:`Sconto massimo raggiunto: −${eur(cur)} a persona per tutti.`}</div></div>`;
}
function scaglioniEditor(t){
  return `<h3 style="margin-top:14px">Più siamo, meno paghi</h3><p class="tiny muted">Sconto a persona che scatta per tutti i partecipanti quando il gruppo raggiunge il numero di iscritti. Chi ha già prenotato riceve la differenza.</p>
  ${(t.scaglioni||[]).map((s,i)=>`<div class="grid g3" style="align-items:end">${inp('scaglioni.'+i+'.da','Da quanti iscritti',{type:'number'})}${inp('scaglioni.'+i+'.sconto','Sconto € a persona',{type:'number'})}<div class="field"><button class="btn sm ghost" onclick="delRow('scaglioni',${i})">Rimuovi</button></div></div>`).join('')}
  <button class="btn sm" onclick="addRow('scaglioni',{da:${Math.max(10,(+UI.draft.minPartecipanti||20)+5)},sconto:15})">+ Aggiungi scaglione</button>`;
}
async function checkScaglioni(tid){
  const t = S.tours[tid]; if(!t || !scaglioniOf(t).length) return;
  const lvl = scontoLivello(t, occupied(t)); if(lvl <= (+t.scontoApplicato||0)) return;
  for(const b of activeBookings(t)){
    const prima = +b.scontoGruppo||0; if(prima >= lvl) continue;
    const diff = (lvl - prima) * b.pax, nb = Object.assign({}, b, {scontoGruppo:lvl, totale:Math.max(0,(b.totale||0) - diff)});
    if(nb.rate) nb.rate = nb.rate.map((r,i,a)=>i===a.length-1 && !r.pagata ? Object.assign({}, r, {importo:Math.max(0, r.importo - diff)}) : r);
    if((nb.pagato||0) >= nb.totale && nb.stato!=='bloccata') nb.stato = 'saldata';
    await save('bookings', nb);
    await notify('user:'+b.userId, `🎉 Il gruppo di «${t.titolo}» è cresciuto: ora paghi ${eur(lvl)} in meno a persona. Il tuo totale scende a ${eur(nb.totale)}${(nb.pagato||0)>nb.totale?' e la differenza ti viene rimborsata':''}.`, {tourId:tid});
  }
  await save('tours', Object.assign({}, S.tours[tid], {scontoApplicato:lvl}));
  await notify('org:'+t.orgId, `«${t.titolo}»: raggiunto lo scaglione di ${occupied(t)} iscritti, sconto di ${eur(lvl)} a persona applicato a tutti.`, {tourId:tid});
}

const CITTA_XY = { roma:[41.90,12.50], milano:[45.46,9.19], napoli:[40.85,14.27], torino:[45.07,7.69], firenze:[43.77,11.25], bologna:[44.49,11.34], venezia:[45.44,12.33], mestre:[45.49,12.24], verona:[45.44,10.99], padova:[45.41,11.88], genova:[44.41,8.93], bari:[41.12,16.87], palermo:[38.12,13.36], catania:[37.50,15.09], pescara:[42.46,14.21], ancona:[43.62,13.52], perugia:[43.11,12.39], terni:[42.56,12.64], orte:[42.46,12.39], viterbo:[42.42,12.10], rieti:[42.40,12.86], latina:[41.47,12.90], frosinone:[41.64,13.34], cassino:[41.49,13.83], caserta:[41.07,14.33], salerno:[40.68,14.77], avellino:[40.91,14.79], benevento:[41.13,14.78], foggia:[41.46,15.55], lecce:[40.35,18.17], taranto:[40.47,17.24], brindisi:[40.63,17.94], potenza:[40.64,15.80], matera:[40.67,16.60], cosenza:[39.30,16.25], 'reggio calabria':[38.11,15.65], arezzo:[43.46,11.88], siena:[43.32,11.33], pisa:[43.72,10.40], livorno:[43.55,10.31], lucca:[43.84,10.50], prato:[43.88,11.10], 'la spezia':[44.10,9.82], parma:[44.80,10.33], modena:[44.65,10.93], 'reggio emilia':[44.70,10.63], piacenza:[45.05,9.69], brescia:[45.54,10.21], bergamo:[45.70,9.67], como:[45.81,9.09], trento:[46.07,11.12], bolzano:[46.50,11.35], udine:[46.06,13.24], trieste:[45.65,13.78], 'l\'aquila':[42.35,13.40], chieti:[42.35,14.17], teramo:[42.66,13.70], campobasso:[41.56,14.66], 'ascoli piceno':[42.85,13.58], macerata:[43.30,13.45], rimini:[44.06,12.57], ravenna:[44.42,12.20], ferrara:[44.84,11.62], civitavecchia:[42.09,11.80], fiumicino:[41.77,12.24], tivoli:[41.96,12.80], colleferro:[41.73,13.00], 'valmontone':[41.78,12.92], formia:[41.26,13.61], sora:[41.72,13.61] };
function cittaXY(s){ const k = (s||'').toLowerCase().split(',')[0].trim(); if(CITTA_XY[k]) return CITTA_XY[k]; const f = Object.keys(CITTA_XY).find(c=>k.startsWith(c) || (s||'').toLowerCase().includes(c)); return f ? CITTA_XY[f] : null; }
function kmTra(a, b){ const R=6371, dLa=(b[0]-a[0])*Math.PI/180, dLo=(b[1]-a[1])*Math.PI/180; const x = Math.sin(dLa/2)**2 + Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLo/2)**2; return Math.round(2*R*Math.asin(Math.sqrt(x))*1.25); }
function fermataVicina(t, citta){
  const me_ = cittaXY(citta), q = (citta||'').toLowerCase().trim(); let best = null;
  (t.punti||[]).forEach((p,i)=>{ let km = null; if((p.luogo||'').toLowerCase().includes(q)) km = 0; else { const xy = cittaXY(p.luogo); if(me_ && xy) km = kmTra(me_, xy); } if(km!=null && (!best || km < best.km)) best = {p, i, km}; });
  return best;
}
function cittaRisultati(res, citta){
  const rows = res.map(t=>({t, f:fermataVicina(t, citta)})).filter(x=>x.f && x.f.km<=60).sort((a,b)=>a.f.km-b.f.km || (a.t.dataInizio<b.t.dataInizio?-1:1));
  return `<div class="card" style="overflow-x:auto;margin-bottom:18px"><table><tr><th>Tour</th><th>Partenza</th><th>Fermata più vicina a ${esc(citta)}</th><th>Orario</th><th class="num">Distanza</th><th class="num">Quota da</th><th></th></tr>${rows.map(({t,f})=>`<tr><td><b style="cursor:pointer" onclick="go('tour','${t.id}')">${esc(t.titolo)}</b></td><td class="small">${fdate(t.dataInizio,'y')}</td><td class="small">${esc(f.p.luogo)}</td><td class="small">${esc(f.p.orario||'—')}</td><td class="num small">${f.km?f.km+' km':'in città'}</td><td class="num">${eur(fromPrice(t))}</td><td><button class="btn sm" onclick="go('tour','${t.id}')">Apri</button></td></tr>`).join('')||`<tr><td colspan="7" class="muted small">Nessun pullman passa entro 60 km da ${esc(citta)}. Prova una città vicina o <a style="cursor:pointer" onclick="openDomanda({destinazione:'Partenza da ${esc(citta).replace(/'/g,'')}'})">proponi una partenza dalla tua città</a>.</td></tr>`}</table></div>`;
}

/* ---------- calendario delle partenze ---------- */
function calendario(res){
  const base = UI.calM ? new Date(UI.calM+'-01') : new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
  const y = base.getFullYear(), m = base.getMonth(), first = new Date(y, m, 1), days = new Date(y, m+1, 0).getDate(), off = (first.getDay()+6)%7;
  const key = (yy,mm) => yy+'-'+String(mm+1).padStart(2,'0');
  const prev = new Date(y, m-1, 1), next = new Date(y, m+1, 1);
  const byDay = {}; res.forEach(t=>{ const s = d(t.dataInizio), e = d(t.dataFine)||s; for(let x=new Date(s); x<=e; x=new Date(x.getTime()+864e5)){ if(x.getFullYear()===y && x.getMonth()===m){ (byDay[x.getDate()]=byDay[x.getDate()]||[]).push({t, start: x.getTime()===s.getTime()}); } } });
  let cells = ''; for(let i=0;i<off;i++) cells += '<div></div>';
  for(let g=1; g<=days; g++){ const it = byDay[g]||[]; cells += `<div class="calc ${new Date(y,m,g).toDateString()===TODAY.toDateString()?'oggi':''}"><div class="tiny muted">${g}</div>${it.slice(0,3).map(x=>`<div class="calt ${x.start?'s':''}" onclick="go('tour','${x.t.id}')" title="${esc(x.t.titolo)}">${x.start?esc(x.t.titolo):'·'}</div>`).join('')}${it.length>3?`<div class="tiny muted">+${it.length-3}</div>`:''}</div>`; }
  return `<div class="row between" style="margin-bottom:10px"><button class="btn sm" onclick="UI.calM='${key(prev.getFullYear(),prev.getMonth())}';renderAll()">← ${MESI[prev.getMonth()]}</button><h3 style="margin:0">${MESI[m]} ${y}</h3><button class="btn sm" onclick="UI.calM='${key(next.getFullYear(),next.getMonth())}';renderAll()">${MESI[next.getMonth()]} →</button></div>
  <div class="cal"><div class="calh">Lun</div><div class="calh">Mar</div><div class="calh">Mer</div><div class="calh">Gio</div><div class="calh">Ven</div><div class="calh">Sab</div><div class="calh">Dom</div>${cells}</div>`;
}

/* ---------- quote divise e salvadanaio ---------- */
function quoteDivise(t, b, tot){
  const occ = b.camere.flatMap(r=>r.occ.map((o,i)=>({o, pp: personPrice(t, r.condivisa?'doppia':(r.tipo==='posto'?null:r.tipo), o.eta, r.condivisa?0:i, r.mezziPropri)})));
  const base = occ.reduce((s,x)=>s+x.pp,0)||1; let rest = tot;
  return occ.map((x,i)=>{ const imp = i===occ.length-1 ? rest : Math.round(tot*x.pp/base); rest -= imp; return {nome:x.o.nome||('Partecipante '+(i+1)), importo:imp, pagata:i===0, codice:(Math.random().toString(36).slice(2,8)).toUpperCase(), invito:x.o.invito||''}; });
}
function pianoSalvadanaio(t, tot){
  const dep = d(t.dataInizio), today = new Date(TODAY), last = new Date(dep.getTime()-30*864e5);
  let n = Math.max(2, Math.min(10, (last.getFullYear()-today.getFullYear())*12 + last.getMonth()-today.getMonth() + 1));
  const r = Math.floor(tot/n), iso = x => x.toISOString().slice(0,10);
  return Array.from({length:n}, (_,i)=>({n:i+1, data:iso(new Date(today.getFullYear(), today.getMonth()+i, Math.min(today.getDate(),28))), importo: i===n-1 ? tot - r*(n-1) : r, pagata:i===0}));
}
function payExtraButtons(t, b, TT){
  const n = b.pax, piano = pianoSalvadanaio(t, TT.tot);
  return `<div class="grid g2" style="margin-top:8px">${n>1?`<button class="btn ghost" onclick="confirmBooking('quota')">Paga solo la tua quota (${eur(Math.round(TT.tot/n))} circa): gli altri ricevono un link</button>`:'<span></span>'}<button class="btn ghost" onclick="confirmBooking('salvadanaio')">Salvadanaio: ${piano.length} rate mensili da ${eur(piano[0].importo)}</button></div>`;
}
function quoteBox(b){
  if(!b.quote || b.stato==='annullata') return '';
  const base = location.href.split('#')[0];
  return `<div class="hotel small"><b>Ognuno paga la sua quota</b><table>${b.quote.map(q=>`<tr><td>${esc(q.nome)}</td><td class="num">${eur(q.importo)}</td><td>${q.pagata?'<span class="badge green">pagata</span>':`<button class="btn sm" onclick="copyText('Ciao! Questa è la tua quota per «${esc((S.tours[b.tourId]||{}).titolo||'').replace(/'/g,'')}»: ${eur(q.importo)}. Paga qui: ${base}#paga-${q.codice}')">Copia link</button> <a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent('Ecco la tua quota per il viaggio: '+base+'#paga-'+q.codice)}">WhatsApp</a> <button class="btn sm ghost" onclick="openPayShare('${q.codice}')">Paga per lui</button>`}</td></tr>`).join('')}</table></div>`;
}
function findShare(code){ for(const b of Object.values(S.bookings)){ const i = (b.quote||[]).findIndex(q=>q.codice===code); if(i>=0) return {b, i}; } return null; }
function openPayShare(code){
  const x = findShare(code); if(!x){ toast('Link di pagamento non valido'); return; }
  const q = x.b.quote[x.i], t = S.tours[x.b.tourId]||{}, by = S.users[x.b.userId]||{};
  openModal(`<h2>La tua quota di viaggio</h2><p><b>${esc(t.titolo||'')}</b><br><span class="small muted">${frange(t.dataInizio,t.dataFine)} · prenotato da ${esc(by.nome||'')} ${esc(by.cognome||'')}</span></p>
  <div class="card pad" style="margin:12px 0"><div class="row between"><span>${esc(q.nome)}</span><b style="font-size:1.4rem">${eur(q.importo)}</b></div></div>
  ${q.pagata?'<div class="notice green">Questa quota è già stata pagata. Grazie!</div>':`<button class="btn pri block" onclick="payShare('${code}')">Paga ${eur(q.importo)} (simulato)</button><p class="tiny muted" style="margin-top:8px">Pagamento simulato: nessun addebito reale.</p>`}`);
}
async function payShare(code){
  const x = findShare(code); if(!x) return; const b = clone(x.b); b.quote[x.i].pagata = true; b.quote[x.i].pagataIl = new Date().toISOString();
  b.pagato = b.quote.filter(q=>q.pagata).reduce((s,q)=>s+q.importo,0); b.stato = b.pagato>=b.totale ? 'saldata' : 'acconto';
  await save('bookings', b); const t = S.tours[b.tourId]||{};
  await notify('user:'+b.userId, `💶 ${b.quote[x.i].nome} ha pagato la sua quota (${eur(b.quote[x.i].importo)}) per «${t.titolo}».`, {tourId:b.tourId});
  await notify('org:'+b.orgId, `Quota pagata da ${b.quote[x.i].nome} per «${t.titolo}» (${eur(b.quote[x.i].importo)})`, {tourId:b.tourId});
  closeModal(); toast('Quota pagata, grazie!');
}

async function setGratuito(bid, on){
  const b = S.bookings[bid], t = S.tours[b.tourId], base = b.totaleIntero || b.totale, quota = Math.round(base/b.pax);
  const g = Math.max(0, Math.min(b.pax, (+b.gratuiti||0) + (on?1:-1))), tot = Math.max(0, base - quota*g);
  const nb = Object.assign({}, b, {gratuiti:g, totaleIntero:base, totale:tot, stato: b.stato==='bloccata' ? 'bloccata' : (b.pagato||0)>=tot ? 'saldata' : 'acconto'});
  await save('bookings', nb); await notify('user:'+b.userId, on?`🎁 Il referente ha assegnato un posto gratuito nella tua prenotazione per «${t.titolo}»: il totale scende a ${eur(tot)}.`:`Un posto gratuito della tua prenotazione per «${t.titolo}» è stato riassegnato.`, {tourId:t.id}); await notify('org:'+t.orgId, `Gratuità ${on?'assegnata a':'tolta a'} ${(S.users[b.userId]||{}).nome||''} su «${t.titolo}»`, {tourId:t.id});
}

/* ---------- locandina con QR ---------- */
function qrSvg(text, size){
  try{ const q = qrcode(0, 'M'); q.addData(text); q.make(); const n = q.getModuleCount(), c = (size||160)/n; let r = ''; for(let y=0;y<n;y++) for(let x=0;x<n;x++) if(q.isDark(y,x)) r += `<rect x="${(x*c).toFixed(2)}" y="${(y*c).toFixed(2)}" width="${(c+.3).toFixed(2)}" height="${(c+.3).toFixed(2)}"/>`; return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size||160} ${size||160}" width="${size||160}" height="${size||160}"><rect width="100%" height="100%" fill="#fff"/><g fill="#16302f">${r}</g></svg>`; }
  catch(e){ return ''; }
}

/* ---------- pullman condiviso tra agenzie ---------- */
function compatibili(t){
  const w = s => new Set((s||'').toLowerCase().split(/[^a-zàèéìòù]+/).filter(x=>x.length>3));
  const tw = w(t.titolo+' '+(t.categorie||[]).join(' '));
  return publicTours().concat(Object.values(S.tours).filter(x=>x.stato==='pubblicato')).filter((x,i,a)=>a.indexOf(x)===i).filter(x=>x.id!==t.id && x.orgId!==t.orgId && x.stato==='pubblicato' && Math.abs(daysTo(x.dataInizio)-daysTo(t.dataInizio))<=3 && daysTo(x.dataInizio)>=0 && (x.tipo===t.tipo || (hasBus(x)&&hasBus(t)))).map(x=>{ const xw = w(x.titolo+' '+(x.categorie||[]).join(' ')); const com = [...tw].filter(k=>xw.has(k)).length; return {x, com}; }).filter(o=>o.com>0 || o.x.festivita===t.festivita && t.festivita).sort((a,b)=>b.com-a.com);
}

async function acceptPool(id){

  const m = host.mezzo||{}, blk = new Set(m.bloccati||[]), tk = takenSeats(host); let s = 1; const next = () => { while(s<=(+m.posti||0) && (blk.has(s)||tk.has(s))) s++; tk.add(s); return s; };

  }
  await save('tours', Object.assign({}, from, {stato:'annullato', unitoA:host.id, motivoAnnullo:'Unito al pullman di un\'altra agenzia'}));

  await notify('org:'+p.fromOrgId, `✅ ${(S.orgs[host.orgId]||{}).nome} ha accettato: i tuoi ${p.pax} clienti viaggiano su «${host.titolo}». Commissione ${p.commissione}%.`, {tourId:host.id});
  await checkConfirmation(host.id); await checkScaglioni(host.id);

/* ---------- preventivatore pullman ---------- */
function openBusCalc(){
  const t = UI.draft, g = nights(t.dataInizio,t.dataFine)+1, c = UI.bc || {km:600, giorni:g, fisso:420, perKm:1.3, ztl:0, notti:Math.max(0,g-1), vitto:90, iva:10};
  UI.bc = c;
  const f = (k,l,step) => `<div class="field"><label>${l}</label><input type="number" step="${step||1}" value="${c[k]}" oninput="UI.bc.${k}=+this.value;busCalcUpd()"></div>`;

function busCalcVals(){
  const c = UI.bc, ore = c.km/70, oreGiorno = ore/Math.max(1,c.giorni), secondo = oreGiorno > 9;

  v.imp = Object.values(v).reduce((a,b)=>a+b,0); v.iva = Math.round(v.imp*c.iva/100); v.tot = Math.round(v.imp+v.iva); v.ore = ore; v.oreGiorno = oreGiorno; v.sec = secondo; return v;

/* ---------- giro di raccolta ottimizzato ---------- */
function openGiro(){
  const t = UI.draft, pts = (t.punti||[]).filter(p=>p.luogo); if(pts.length<3){ toast('Servono almeno 3 punti di raccolta'); return; }
  const start = pts[0], rest = pts.slice(1), known = rest.filter(p=>cittaXY(p.luogo)), unknown = rest.filter(p=>!cittaXY(p.luogo));
  const order = [start]; let cur = cittaXY(start.luogo); const pool = known.slice();
  if(cur){ while(pool.length){ let bi = 0, bd = 1e9; pool.forEach((p,i)=>{ const dd = kmTra(cur, cittaXY(p.luogo)); if(dd<bd){ bd=dd; bi=i; } }); const p = pool.splice(bi,1)[0]; order.push(p); cur = cittaXY(p.luogo); } } else order.push(...pool);
  order.push(...unknown);
  const toMin = s => { const m = /(\d{1,2})[:.](\d{2})/.exec(s||''); return m ? (+m[1])*60 + (+m[2]) : null; }, fmt = x => String(Math.floor(x/60)%24).padStart(2,'0')+':'+String(x%60).padStart(2,'0');
  let tm = toMin(start.orario) ?? 360; const out = order.map((p,i)=>{ if(i>0){ const a = cittaXY(order[i-1].luogo), b = cittaXY(p.luogo); const km = a&&b ? kmTra(a,b) : 30; tm += Math.round(km/75*60) + 10; return {luogo:p.luogo, orario:fmt(tm), km:a&&b?km:null}; } return {luogo:p.luogo, orario:fmt(tm), km:0}; });
  UI.giro = out.map(x=>({luogo:x.luogo, orario:x.orario}));
  openModal(`<h2>Giro di raccolta ottimizzato</h2><p class="small muted">Ordine proposto partendo dal primo punto: ogni fermata è la più vicina alla precedente. Orari calcolati a 75 km/h di media più 10 minuti di sosta.</p><table><tr><th>#</th><th>Fermata</th><th class="num">Km dalla precedente</th><th>Orario</th></tr>${out.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.luogo)}${!cittaXY(x.luogo)?' <span class="badge amber">posizione non riconosciuta</span>':''}</td><td class="num">${i?(x.km!=null?x.km:'?'):'—'}</td><td>${x.orario}</td></tr>`).join('')}</table><div class="row" style="margin-top:12px"><button class="btn pri" onclick="UI.draft.punti=clone(UI.giro);closeModal();renderAll();toast('Giro di raccolta aggiornato')">Applica</button><button class="btn ghost" onclick="closeModal()">Lascia com'è</button></div>`);
}

  return `<h2>Avvisi di viaggio</h2><p class="small muted">Meteo, scioperi, viabilità e avvisi della Farnesina. Quando un avviso tocca la zona e le date di un tour, OVIGO avvisa in automatico i viaggiatori e l'agenzia e mostra l'avviso nella pagina del tour. In produzione gli avvisi arrivano dai servizi ufficiali; qui puoi inserirli o simularli.</p>

  <div class="card" style="overflow-x:auto"><table><tr><th>Tipo</th><th>Avviso</th><th>Periodo</th><th>Zona</th><th>Tour coinvolti</th><th></th></tr>${list.map(a=>{ const tt = Object.values(S.tours).filter(t=>t.stato==='pubblicato'&&avvisiFor(t).some(x=>x.id===a.id)); return `<tr><td class="small">${esc(AVVISO_TIPI[a.tipo]||'')}</td><td><b>${esc(a.titolo)}</b><div class="small muted">${esc(a.testo||'')}</div></td><td class="small">${frange(a.dal,a.al)}</td><td class="small">${esc(a.zona||'tutta Italia')}</td><td class="small">${tt.map(t=>esc(t.titolo)).join('<br>')||'—'}</td><td><button class="btn sm ghost" onclick="remove('avvisi','${a.id}')">Elimina</button></td></tr>`; }).join('')||'<tr><td colspan="6" class="muted small">Nessun avviso attivo.</td></tr>'}</table></div>`;
}
async function addAvviso(){ if(!val('av_ti')||!val('av_d')){ toast('Titolo e data'); return; } const n = await publishAvviso({tipo:val('av_t'), dal:val('av_d'), al:val('av_a')||val('av_d'), zona:val('av_z'), titolo:val('av_ti'), testo:val('av_x')}); toast('Avviso pubblicato · '+n+' viaggiatori avvisati'); }
async function simulaAvvisi(){
  const tours = Object.values(S.tours).filter(t=>t.stato==='pubblicato' && daysTo(t.dataInizio)>=0).sort((a,b)=>a.dataInizio<b.dataInizio?-1:1); if(!tours.length) return;
  const t1 = tours[0], t2 = tours.find(t=>t.area==='estero') || tours[1] || t1, w = s => (s.titolo.split(/[ ,—:]+/).find(x=>x.length>5)||s.titolo.split(' ')[0]);
  let n = await publishAvviso({tipo:'sciopero', dal:t1.dataInizio, al:t1.dataInizio, zona:'', titolo:'Sciopero nazionale del trasporto pubblico locale di 24 ore', testo:'Possibili ritardi ai punti di raccolta nelle grandi città.'});
  n += await publishAvviso({tipo:'meteo', dal:t1.dataInizio, al:t1.dataFine, zona:w(t1), titolo:'Allerta gialla per neve e ghiaccio', testo:'Il pullman viaggia con catene a bordo; possibili variazioni di orario.'});
  if(t2.area==='estero') n += await publishAvviso({tipo:'farnesina', dal:t2.dataInizio, al:t2.dataFine, zona:w(t2), titolo:'Aggiornamento Viaggiare Sicuri per la destinazione', testo:'Documento valido per l\'espatrio obbligatorio; consigliata la registrazione su Dove siamo nel mondo.'});
  toast('Feed simulato · '+n+' notifiche inviate');
}

/* ---------- sul telefono, anche senza internet ---------- */
function offlinePack(bid){
  const b = S.bookings[bid], t = S.tours[b.tourId], o = S.orgs[t.orgId]||{};
  const html = `<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(t.titolo)} · OVIGO</title><style>body{font-family:system-ui,sans-serif;margin:0;padding:18px;color:#16302f;background:#fbf8f2}h1{font-size:1.4rem}section{background:#fff;border-radius:12px;padding:14px;margin:12px 0}b{color:#0f4c5c}small{color:#6b7a78}</style></head><body><small>OVIGO · documento di viaggio salvato il ${new Date().toLocaleDateString('it-IT')}</small><h1>${esc(t.titolo)}</h1><p>${frange(t.dataInizio,t.dataFine)} · ${esc(o.nome||'')} ${esc(o.cellulare||o.telefono||'')}</p>
  <section><b>Voucher</b><p>Prenotazione ${esc(b.id)} · ${b.pax} partecipanti: ${(b.partecipanti||[]).map(p=>esc(p.nome)).join(', ')}${(b.seats||[]).length?'<br>Posti in pullman: '+b.seats.join(', '):''}${(t.punti||[])[b.punto]?'<br>Raccolta: '+esc(t.punti[b.punto].luogo)+' alle '+esc(t.punti[b.punto].orario||''):''}</p></section>
  ${t.convocazione?`<section><b>Convocazione</b><p>${esc(t.convocazione.testo)}</p></section>`:''}
  <section><b>Programma</b>${(t.programma||[]).map((g,i)=>`<p><b>${i+1}° giorno</b> ${esc(g.titolo||'')}<br><small>${esc(g.testo||'')}</small></p>`).join('')}</section>
  <section><b>Hotel</b>${(t.hotel||[]).map(h=>`<p>${esc(h.nome||'')} · ${esc(h.zona||'')}</p>`).join('')||'<p>—</p>'}</section>
  <section><b>Numeri utili</b><p>Agenzia: ${esc(o.cellulare||o.telefono||'')}<br>Emergenze: 112</p></section></body></html>`;
  UI.offHtml = html;
  openModal(`<h2>Il viaggio sul tuo telefono</h2><p>Salva un file con voucher, convocazione, programma e numeri utili: si apre anche senza internet.</p><button class="btn pri" onclick="saveFile('viaggio-'+(S.tours[S.bookings['${bid}'].tourId].titolo||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40)+'.html', UI.offHtml)">Salva il file del viaggio</button><p class="small"><b>Per avere OVIGO come un'app:</b> apri il sito dal telefono, poi «Condividi → Aggiungi a schermata Home» su iPhone, oppure il menu ⋮ → «Installa app» su Android.</p><button class="btn ghost" onclick="closeModal()">Chiudi</button>`);
}
function bookingExtras(b){
  const t = S.tours[b.tourId]; if(!t || b.tipo!=='prenotazione' || b.stato==='annullata') return '';
  return `${quoteBox(b)}${autorizzazioneBox(b)}<div class="row small" style="margin-top:8px;gap:8px"><button class="btn sm ${b.contratto?'ghost':''}" onclick="openContratto('${b.id}')">${b.contratto?'Contratto firmato':'Firma il contratto'}</button>${(b.pagato||0)>0?`<button class="btn sm ghost" onclick="openFattura('${b.id}')">Fattura</button>`:''}<button class="btn sm ghost" onclick="offlinePack('${b.id}')">Salva sul telefono</button>${b.scontoGruppo?`<span class="badge green">sconto gruppo −${eur(b.scontoGruppo)} a persona</span>`:''}${b.tourOriginale?'<span class="badge">unito a un altro gruppo</span>':''}</div>`;

function lang(){ return lsGet('ovigo-lang') || 'it'; }
function setLang(l){ try{ localStorage.setItem('ovigo-lang', l); }catch(e){} renderAll(); }
function translateDom(root){
  if(lang()!=='en' || !root) return;
  const keys = Object.keys(EN).sort((a,b)=>b.length-a.length);
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); const nodes = []; while(w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n=>{ const s = n.nodeValue, tr = s.trim(); if(!tr) return; if(EN[tr]){ n.nodeValue = s.replace(tr, EN[tr]); return; } let v = s; for(const k of keys){ if(k.length>6 && v.includes(k)) v = v.split(k).join(EN[k]); } if(v!==s) n.nodeValue = v; });
  root.querySelectorAll('input[placeholder],textarea[placeholder]').forEach(i=>{ if(EN[i.placeholder]) i.placeholder = EN[i.placeholder]; });
}
function langSwitch(){ return `<span class="lang"><a class="${lang()==='it'?'on':''}" onclick="setLang('it')">IT</a><a class="${lang()==='en'?'on':''}" onclick="setLang('en')">EN</a></span>`; }

  if(UI.payCode && loaded.bookings && Object.keys(S.bookings).length){ const c = UI.payCode; UI.payCode = null; setTimeout(()=>openPayShare(c), 60); }
}

const GUIDE_AREE = { cliente:'Viaggiatori', agenzia:'Agenzie', accompagnatore:'Accompagnatori', admin:'Super admin' };
const GUIDE_DIR = 'guide/';
function guideOf(id){ return (window.GUIDES||[]).find(g=>g.id===id); }
function fmtDur(s){ s = Math.round(s||0); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function viewGuide(param){

      ${g ? `<section class="gd-main">

        <div class="row" style="margin:14px 0 22px"><button class="btn pri" onclick="guidePdf('${g.id}')">Scarica la guida in PDF</button>${g.user?`<button class="btn" onclick="tryGuide('${g.id}')">Prova adesso nella demo</button>`:`<button class="btn" onclick="go('home')">Prova adesso nella demo</button>`}</div>

    </div></div>`;
}
function zoomStep(id, i){ const g = guideOf(id), s = g.steps[i]; openModal(`<img src="${GUIDE_DIR}${id}-${i+1}.jpg" alt="" style="width:100%;border-radius:10px"><h3 style="margin:12px 0 4px">${i+1}. ${esc(s.t)}</h3><p class="small">${esc(s.d)}</p><div class="row between"><button class="btn sm" ${i?'':'disabled'} onclick="zoomStep('${id}',${i-1})">← Precedente</button><button class="btn sm" ${i<g.steps.length-1?'':'disabled'} onclick="zoomStep('${id}',${i+1})">Successivo →</button></div>`, true); }

/* ---- librerie per i PDF, caricate solo quando servono ---- */
function loadScript(src){ return new Promise((res,rej)=>{ if(document.querySelector(`script[src="${src}"]`)) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function needPdfLibs(html){ await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'); if(html) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'); return window.jspdf && window.jspdf.jsPDF; }
function imgData(src){ return new Promise((res,rej)=>{ const i = new Image(); i.onload = ()=>{ try{ const c = document.createElement('canvas'); c.width = i.naturalWidth; c.height = i.naturalHeight; c.getContext('2d').drawImage(i,0,0); res({d:c.toDataURL('image/jpeg',.82), w:i.naturalWidth, h:i.naturalHeight}); }catch(e){ rej(e); } }; i.onerror = rej; i.src = src; }); }
async function guidePdf(id){
  const g = guideOf(id); if(!g) return;
  if(location.protocol==='file:'){ const a = document.createElement('a'); a.href = GUIDE_DIR+id+'.pdf'; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); return; }
  toast('Preparo il PDF…');
  let J; try{ J = await needPdfLibs(); }catch(e){ toast('Non riesco a caricare il generatore di PDF: controlla la connessione'); return; }
  const doc = new J({unit:'mm', format:'a4'}), W = 210, M = 16;
  const teal = [15,76,92], coral = [226,98,43], ink = [22,48,47];
  doc.setFillColor(...teal); doc.rect(0,0,W,297,'F');
  doc.setTextColor(255,179,143); doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text(('Guida per: '+GUIDE_AREE[g.area]).toUpperCase(), M, 90);
  doc.setTextColor(255,255,255); doc.setFont('times','bold'); doc.setFontSize(32); doc.text(doc.splitTextToSize(g.titolo, W-2*M), M, 106);
  doc.setFont('helvetica','normal'); doc.setFontSize(13); doc.text(doc.splitTextToSize(g.intro, W-2*M), M, 136);
  doc.setFontSize(11); doc.text(`${g.steps.length} passi · video di ${fmtDur(g.durata)} nella sezione Guide della piattaforma`, M, 168);
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.text('OVIGO · Viaggi di gruppo', M, 280);
  for(let i=0;i<g.steps.length;i++){
    if(i%2===0){ doc.addPage(); doc.setFillColor(...teal); doc.rect(0,0,W,12,'F'); doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.text('OVIGO · '+g.titolo, M, 8); doc.text('pag. '+(Math.floor(i/2)+2), W-M, 8, {align:'right'}); }
    const y0 = i%2===0 ? 22 : 158, s = g.steps[i];
    doc.setFillColor(...coral); doc.circle(M+5, y0+4, 5, 'F'); doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text(String(i+1), M+5, y0+5.6, {align:'center'});
    doc.setTextColor(...ink); doc.setFontSize(14); doc.text(s.t, M+14, y0+6);
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(70,90,88); const lines = doc.splitTextToSize(s.d, W-2*M-14); doc.text(lines, M+14, y0+12);
    try{ const im = await imgData(GUIDE_DIR+id+'-'+(i+1)+'.jpg'); const iw = W-2*M, ih = iw*im.h/im.w; doc.addImage(im.d, 'JPEG', M, y0+14+lines.length*4.6, iw, Math.min(ih, 100)); }catch(e){}
  }
  await saveFile('OVIGO-guida-'+g.titolo.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40)+'.pdf', doc.output('blob'));
}

/* ---- stampa dei documenti (contratto, fattura, locandina, pratica) come PDF ---- */
async function printModal(){
  const box = document.getElementById('mbox'); if(!box) return;
  if(location.protocol==='file:'){ document.body.classList.add('printing'); window.print(); setTimeout(()=>document.body.classList.remove('printing'), 500); return; }
  toast('Preparo il PDF…');
  let J; try{ J = await needPdfLibs(true); }catch(e){ toast('Non riesco a caricare il generatore di PDF: controlla la connessione'); return; }
  const hide = [...box.querySelectorAll('.x, .row, button')]; hide.forEach(e=>{ e.dataset.vis = e.style.visibility; e.style.visibility = 'hidden'; });
  try{
    const c = await html2canvas(box, {scale:2, backgroundColor:'#ffffff', useCORS:true});
    const doc = new J({unit:'mm', format:'a4'}), W = 210, M = 10, iw = W-2*M, ph = 297-2*M, pxPerMm = c.width/iw, pagePx = Math.floor(ph*pxPerMm);
    for(let y=0, p=0; y<c.height; y+=pagePx, p++){
      const slice = document.createElement('canvas'); slice.width = c.width; slice.height = Math.min(pagePx, c.height-y); slice.getContext('2d').drawImage(c, 0, y, c.width, slice.height, 0, 0, c.width, slice.height);
      if(p) doc.addPage(); doc.addImage(slice.toDataURL('image/jpeg',.9), 'JPEG', M, M, iw, slice.height/pxPerMm);
    }
    const title = (box.querySelector('h1,h2')||{}).textContent || 'documento';
    await saveFile('OVIGO-'+title.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40)+'.pdf', doc.output('blob'));
  }catch(e){ toast('PDF non disponibile in questa vista'); }
  finally{ hide.forEach(e=>e.style.visibility = e.dataset.vis||''); }
}

async function api(method, path, body){
  const h = {'Content-Type':'application/json'}; if(TOKEN) h.Authorization = 'Bearer '+TOKEN;
  let r; try{ r = await fetch(API+path, {method, headers:h, body: body===undefined ? undefined : JSON.stringify(body)}); }
  catch(e){ const err = new Error('Connessione al server non riuscita'); err.status = 0; throw err; }
  let j = null; try{ j = await r.json(); }catch(e){}
  if(r.status===401 && TOKEN && path!=='/auth/login'){ setToken(''); CUR=''; }
  if(!r.ok){ const err = new Error((j && (typeof j.detail==='string' ? j.detail : 'Dati non validi')) || ('Errore '+r.status)); err.status = r.status; throw err; }
  return j;
}
function setToken(t){ TOKEN = t||''; lsSet('ovigo-token', TOKEN); }

async function initDb(){
  MODE = 'connessione'; renderBar();
  if(TOKEN){ try{ const j = await api('GET','/auth/me'); CUR = j.user.id; S.users[CUR] = j.user; }catch(e){ if(e.status===401){ setToken(''); CUR=''; } } }
  else CUR = '';
  await syncNow(true);
  clearInterval(SYNC_TIMER); SYNC_TIMER = setInterval(()=>syncNow(false), 15000);
  let n = 0; setInterval(()=>{ if(++n % 20 === 0) syncNow(true); }, 15000);
  handleAuthHash();
}
async function syncNow(full){
  if(SYNC_BUSY) return; SYNC_BUSY = true;
  try{
    const j = await api('GET','/sync?since='+(full?0:SYNC_TS));
    let changed = full;
    if(full) COLL.forEach(c => S[c] = {});
    for(const c in j.docs){ if(!S[c]) S[c] = {}; j.docs[c].forEach(o => { S[c][o.id] = norm(c, o); }); changed = true; }
    (j.deleted||[]).forEach(x => { if(S[x.c] && S[x.c][x.id]){ delete S[x.c][x.id]; changed = true; } });
    SYNC_TS = j.now; COLL.forEach(c => loaded[c] = true);
    if(CUR && !S.users[CUR]){ CUR=''; setToken(''); }
    const was = MODE; MODE = 'online';
    if(changed || was!=='online') scheduleRender();
  }catch(e){ MODE = 'errore'; scheduleRender(); }
  finally{ SYNC_BUSY = false; }
}

async function save(c, obj){
  obj = clone(obj); if(!obj.id) obj.id = uid(c[0]);
  const prima = S[c][obj.id] ? clone(S[c][obj.id]) : null;
  S[c][obj.id] = obj; scheduleRender();
  try{
    const j = await api('PUT', '/doc/'+c+'/'+encodeURIComponent(obj.id), obj);
    if(j && j.doc){ if(j.doc.id!==obj.id) delete S[c][obj.id]; S[c][j.doc.id] = norm(c, j.doc); scheduleRender(); return j.doc; }
  }catch(e){
    if(prima) S[c][obj.id] = prima; else delete S[c][obj.id]; scheduleRender();
    if(c!=='notifications') toast(e.status===401 ? 'Accedi per continuare' : e.status===403 ? 'Operazione non consentita al tuo account' : 'Salvataggio non riuscito: '+e.message);
  }
  return obj;
}
async function remove(c, id){
  const prima = S[c][id]; delete S[c][id]; scheduleRender();
  try{ await api('DELETE', '/doc/'+c+'/'+encodeURIComponent(id)); }
  catch(e){ if(prima) S[c][id] = prima; scheduleRender(); toast('Eliminazione non riuscita'); }
}

  setToken(j.token); CUR = j.user.id; S.users[CUR] = j.user; closeModal();
  await syncNow(true);
  const fn = AFTER_LOGIN; AFTER_LOGIN = null;
  const u = me(); if(!u) return;
  if(fn && u.ruolo==='cliente'){ try{ fn(); }catch(e){} return; }
  if(dest) go(dest);
  else if(u.ruolo==='organizzatore') go('crm'); else if(u.ruolo==='admin') go('admin'); else if(u.ruolo==='accompagnatore') go('staff'); else renderAll();
}

async function confirmBooking(stato){
  const b = UI.bk, t = S.tours[b.tourId];
  if(b.pax > freeSeats(t)){ toast('Nel frattempo i posti sono finiti'); return; }
  const tk = takenSeats(t); if(UI.seatSel.some(s=>tk.has(s))){ toast('Uno dei posti scelti è stato appena preso: scegline un altro'); bookingStep(2); return; }
  const u = me(); if(!u){ requireLogin('Accedi per completare la prenotazione'); return; }
  processInvites(b);
  const TT = bkTotals(t,b), tot = TT.tot;
  const buono = TT.codice ? b.codice : '';
  const scelta = stato;
  const isRate = stato==='rate', isQuota = stato==='quota', isSalv = stato==='salvadanaio'; if(isRate||isQuota||isSalv) stato = 'acconto';
  const quote = isQuota ? quoteDivise(t, b, tot) : null, piano = isSalv ? pianoSalvadanaio(t, tot) : null;
  const bk = await save('bookings', { id:uid('b'), tourId:t.id, orgId:t.orgId, userId:u.id, tipo:'prenotazione', stato: stato==='bloccata'?'bloccata':'attesa_pagamento', pax:b.pax,
    camere: b.camere.filter(r=>r.tipo!=='posto').map(r=>({tipo:r.condivisa?'doppia':r.tipo, condivisa:!!r.condivisa, mezziPropri:!!r.mezziPropri, occ:r.occ})),
    partecipanti: b.camere.flatMap(r=>r.occ), seats: UI.seatSel.slice().sort((a,c)=>a-c), punto: b.punto, note:b.note||'', buono,
    totale: tot, pagato: 0, rate: isSalv?piano : isRate?TT.rate:null, piano: isSalv?'salvadanaio':'', quote, scontoGruppo: TT.sgrPP||0, assicurazioni:TT.assList, sconto:TT.sconto, documenti:{}, canale:'online', trattamento:b.trattamento||'', extraScelti:TT.extraScelti, cf:b.cf||'', createdAt:new Date().toISOString() });
  if(!S.bookings[bk.id]){ return; }
  if(TT.codice && TT.codice.monouso) await save('codici', Object.assign({}, S.codici[TT.codice.id], {usato:true, usatoDa:u.id, usatoIl:new Date().toISOString()}));
  for(const z of Object.values(S.bozze).filter(z=>z.userId===u.id&&z.tourId===t.id)) await remove('bozze', z.id);
  if(b.cf && !u.cf) await save('users', Object.assign({}, S.users[u.id]||u, {cf:b.cf}));
  await notify('org:'+t.orgId, `Nuova prenotazione di ${u.nome} ${u.cognome||''} per «${t.titolo}» (${b.pax} pax, ${eur(tot)})`, {tourId:t.id, bookingId:bk.id});
  await notify('user:'+u.id, scelta==='bloccata' ? `Posto bloccato a 0 € per «${t.titolo}». Ti avviseremo quando la partenza sarà confermata.` : `Prenotazione registrata per «${t.titolo}». Per confermarla fai il bonifico: trovi le coordinate nella tua area, in «Prenotazioni».`, {tourId:t.id, bookingId:bk.id});
  if((t.documenti||[]).length) await notify('user:'+u.id, `Ricordati di caricare i documenti per «${t.titolo}»: ${t.documenti.join(', ')}.`, {tourId:t.id, bookingId:bk.id});
  UI.bk = null;
  setTimeout(()=>syncNow(false), 800);
  if(scelta==='bloccata'){
    openModal(`<h2>Posto bloccato!</h2><p>Non hai pagato nulla. Ti avviseremo appena il gruppo raggiunge il minimo: da quel momento potrai pagare l'acconto con bonifico.</p><div class="row"><button class="btn pri" onclick="closeModal();go('cliente')">Vai alla mia area</button><button class="btn" onclick="closeModal()">Resta qui</button></div>`);
    return;
  }
  const tipo = scelta==='saldata' ? 'saldo' : (scelta==='rate'||scelta==='salvadanaio') ? 'rata' : scelta==='quota' ? 'quota' : 'acconto';
  await chiediBonifico(bk.id, tipo, (tipo==='rata'||tipo==='quota') ? 0 : null, `<div class="notice green small" style="margin-bottom:12px">✓ Prenotazione registrata: il posto è tuo. Si conferma quando l'agenzia riceve il bonifico.</div>`);
}

  else if(/parten|ferm|raccolt|dove|orari/.test(s)) a = (t.punti||[]).length ? 'Punti di raccolta: '+t.punti.map(p=>p.luogo+(p.orario?' alle '+p.orario:'')).join('; ')+'.' : 'I dettagli sulla partenza sono nella scheda del tour.';

  else if(/compren|inclus|incluso/.test(s)) a = 'La quota comprende: '+(t.comprende||[]).join(', ')+'. Non comprende: '+(t.nonComprende||[]).join(', ')+'.';
  else if(/hotel|dorm|camer/.test(s)) a = (t.hotel||[]).length ? 'Si dorme in: '+t.hotel.map(h=>h.nome+(h.stelle?' ('+h.stelle+' stelle)':'')+(h.zona?', '+h.zona:'')).join('; ')+'.' : 'Questo viaggio non prevede pernottamento.';
  else if(/pag|bonific|iban/.test(s)) a = 'Si paga con bonifico: dopo la prenotazione trovi nella tua area l\'IBAN dell\'agenzia, quello di OVIGO per la commissione e la causale da usare.';
  else if(/conferm|minimo|garant|parte/.test(s)) a = confirmed(t) ? 'La partenza è già confermata.' : `Mancano ${Math.max(0,t.minPartecipanti-occupied(t))} persone per confermare la partenza entro il ${fdate(t.dataConferma,'y')}. Se il minimo non si raggiunge non paghi nulla.`;
  else if(/annull|penal|disdic/.test(s)) a = t.condizioni || 'Le condizioni di annullamento sono nella scheda «Info utili».';
  else a = `Per questa domanda ti conviene scrivere a ${org.nome||'l\'organizzatore'}${org.cellulare||org.telefono?' ('+(org.cellulare||org.telefono)+')':''}. Posso aiutarti su prezzi, partenze, pagamenti, documenti, cosa comprende, hotel e conferma del gruppo.`;

}

/* =====================================================================
   FOTO: caricate su Cloudinary + catalogo riutilizzabile
   - il browser riduce la foto (max 2400 px, qualità alta) e la manda direttamente a Cloudinary
   - le pagine chiedono a Cloudinary la misura giusta in formato moderno (f_auto, q_auto:good)
   - ogni foto entra nel catalogo dell'agenzia: si riusa in altri viaggi senza ricaricarla
   ===================================================================== */
if(!COLL.includes('catalogo')){ COLL.push('catalogo'); S.catalogo = S.catalogo || {}; }
function cImg(url, w){
  if(!url || typeof url!=='string') return '';
  if(url.includes('res.cloudinary.com') && url.includes('/upload/') && !url.includes('/upload/f_auto')) return url.replace('/upload/', `/upload/f_auto,q_auto:good,c_limit,w_${w}/`);
  return url;
}
function coverOf(t){ const m = mediaOf(t.id, 'tour')[0]; return m ? m.img : ''; }
function coverHtml(t){ const u = coverOf(t); return u ? `<img src="${cImg(u, 800)}" alt="${esc(t.titolo)}" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block">` : art(t.tema, seedOf(t.id)); }
function galleryHero(t){
  const ph = mediaOf(t.id, 'tour'); if(!ph.length) return `<div class="detailhero">${art(t.tema, seedOf(t.id))}</div>`;
  const i = Math.min(UI.gal||0, ph.length-1);
  return `<div class="detailhero"><img src="${cImg(ph[i].img, 1600)}" alt="Foto del tour ${esc(t.titolo)}" style="width:100%;height:100%;object-fit:cover"></div>${ph.length>1?`<div class="row" style="margin-top:8px;gap:6px">${ph.map((m,j)=>`<img src="${cImg(m.img, 200)}" onclick="UI.gal=${j};renderAll()" alt="" loading="lazy" style="width:64px;height:48px;object-fit:cover;border-radius:8px;cursor:pointer;${j===i?'outline:2px solid var(--coral)':''}">`).join('')}</div>`:''}`;
}
const catOwner = () => { const u = me(); return u && u.ruolo==='admin' ? null : (u||{}).orgId; };
function catalogoMio(){ const o = catOwner(); return Object.values(S.catalogo).filter(c=> me() && (me().ruolo==='admin' || c.orgId===o || !c.orgId)).sort((a,b)=>a.createdAt<b.createdAt?1:-1); }
function usoCatalogo(cid){ return Object.values(S.media).filter(m=>m.catalogoId===cid); }
async function hashFile(f){ try{ const b = await crypto.subtle.digest('SHA-1', await f.arrayBuffer()); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }catch(e){ return ''; } }
/* riduce peso e misure senza perdere qualità visibile */
async function prepImage(f){
  const img = await new Promise((res,rej)=>{ const u = URL.createObjectURL(f), i = new Image(); i.onload = ()=>{ URL.revokeObjectURL(u); res(i); }; i.onerror = rej; i.src = u; });
  const MAX = 2400, sc = Math.min(1, MAX/Math.max(img.width, img.height));
  if(sc===1 && f.size < 1.2e6 && /jpe?g|webp/i.test(f.type)) return {blob:f, w:img.width, h:img.height};
  const c = document.createElement('canvas'); c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
  const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(r=>c.toBlob(r, 'image/jpeg', 0.9));
  return {blob: blob && blob.size < f.size ? blob : f, w:c.width, h:c.height};
}
async function cldUpload(blob, nome, fr){
  const fd = new FormData(); fd.append('file', blob, nome); fd.append('api_key', fr.apiKey); fd.append('timestamp', fr.timestamp); fd.append('folder', fr.folder); fd.append('signature', fr.signature);
  const r = await fetch(`https://api.cloudinary.com/v1_1/${fr.cloudName}/image/upload`, {method:'POST', body:fd});
  const j = await r.json(); if(!r.ok) throw new Error((j.error&&j.error.message)||'Caricamento non riuscito'); return j;
}
/* carica nel catalogo (ed eventualmente aggiunge al viaggio); salta i doppioni */
async function caricaFoto(files, tag, dest){
  files = [...(files||[])].slice(0, 20); if(!files.length) return [];
  let fr; try{ fr = await api('POST','/cloudinary/firma'); }
  catch(e){ if(e.status===503){ toast('Cloudinary non è ancora configurato: chiedi all\'amministratore di inserire le chiavi'); return []; } toast(e.message); return []; }
  const out = []; let n = 0, riusate = 0;
  for(const f of files){
    if(!/^image\//.test(f.type)){ toast(f.name+': non è un\'immagine'); continue; }
    toast(`Caricamento ${++n} di ${files.length}…`);
    try{
      const hash = await hashFile(f);
      let c = hash && catalogoMio().find(x=>x.hash===hash);
      if(c){ riusate++; }
      else {
        const p = await prepImage(f), j = await cldUpload(p.blob, f.name, fr);
        c = await save('catalogo', {id:uid('ct'), orgId:catOwner(), url:j.secure_url, publicId:j.public_id, w:j.width, h:j.height, kb:Math.round(j.bytes/1024), originaleKb:Math.round(f.size/1024), hash, nome:f.name.replace(/\.[^.]+$/,''), tag:tag||'', createdAt:new Date().toISOString()});
      }
      if(dest) await aggiungiDaCatalogo(dest.tid, dest.where, c.id, true);
      out.push(c);
    }catch(e){ toast(f.name+': '+e.message); }
  }
  toast(`${out.length} foto pronte${riusate?` (${riusate} erano già nel catalogo, non ricaricate)`:''}`);
  return out;
}
async function aggiungiDaCatalogo(tid, where, cid, quiet){
  const c = S.catalogo[cid]; if(!c) return;
  if(mediaOf(tid, where).some(m=>m.catalogoId===cid)){ if(!quiet) toast('Questa foto è già nel viaggio'); return; }
  await save('media', {id:uid('ph'), tourId:tid, where, img:c.url, catalogoId:cid, createdAt:new Date().toISOString()});
  if(!quiet){ toast('Foto aggiunta'); if(UI.catPick) openCatalogo(UI.catPick.tid, UI.catPick.where); }
}
async function uploadMedia(tid, where, input){

const MOSTRA_ISCRITTI = { entrambi:'Persone mancanti alla conferma e posti liberi', mancano:'Solo le persone che mancano alla conferma', posti:'Solo i posti disponibili', nessuno:'Nessuno dei due' };

const _tourCardReal = tourCard;

  else riga = `<div class="row between small"><span>${ok?conf:''}</span><span>${free?'':compl}</span></div>`;

const FASCE_MINORI = [[0,2,'0–2 anni'],[3,5,'3–5 anni'],[6,10,'6–10 anni'],[11,13,'11–13 anni'],[14,17,'14–17 anni']];
function minoriFasce(t){
  const c = FASCE_MINORI.map(()=>0);
  activeBookings(t).forEach(b=>(b.partecipanti||[]).forEach(p=>{ if(p.eta===''||p.eta==null) return; const e = +p.eta; if(!(e>=0 && e<18)) return; const i = FASCE_MINORI.findIndex(f=>e>=f[0]&&e<=f[1]); if(i>=0) c[i]++; }));
  return FASCE_MINORI.map((f,i)=>({lbl:f[2], n:c[i]})).filter(x=>x.n);
}
function minoriBox(t){
  const f = minoriFasce(t); if(!f.length) return '';
  const tot = f.reduce((s,x)=>s+x.n,0);
  return `<div class="small" style="margin-top:10px"><b>Minori nel gruppo (${tot})</b></div><div class="row" style="gap:6px;flex-wrap:wrap;margin-top:6px">${f.map(x=>`<span class="badge">${x.n} · ${x.lbl}</span>`).join('')}</div>`;
}

async function sendGroupMsg(tid){
  const t = S.tours[tid], m = val('gm_txt'), when = val('gm_when'); if(!m) return;
  if(when && new Date(when) > new Date()){ await save('programmati', {id:uid('q'), orgId:t.orgId, tourId:tid, tipo:'messaggio', testo:m, quando:new Date(when).toISOString(), stato:'programmato', createdAt:new Date().toISOString()}); toast('Messaggio programmato'); return; }
  try{ const j = await api('POST','/tour/'+encodeURIComponent(tid)+'/gruppo', {testo:m}); toast(`Inviato a ${j.destinatari} iscritti · ${j.conApp} sul telefono`); delete GP_INFO[tid]; syncNow(false); }
  catch(e){ toast('Invio non riuscito: '+e.message); }
}

</script>
